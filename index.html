<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Ennetmax - 3D Drone Uçuş Simülasyonu</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">

    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
	

<style>
 
/* =========================================================
   1. TEMEL SAYFA VE HARİTA
   ========================================================= */

body {
    margin: 0;
    padding: 0;
}

#map {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 100%;
}


/* =========================================================
   2. ÜST BİLDİRİM ALANI
   ========================================================= */

/* Bildirimlerin ekranda konumlandırılması */
#ust-bildirim-alani {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 999999;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    width: max-content;
    max-width: calc(100vw - 24px);
    pointer-events: none;
}

/* Bildirim kutusu */
.ust-bildirim {
    display: flex;
    align-items: center;
    gap: 8px;
    width: fit-content;
    max-width: 100%;
    box-sizing: border-box;
    padding: 4px 8px;
    border-radius: 3px;
    background: #F2F4F7;
    color: #263445;
    border: 1px solid #D1D5DB;
    box-shadow: 0 5px 18px rgba(0, 0, 0, 0.35);
    font-family: Tahoma, sans-serif;
    font-size: 12px;
    opacity: 0;
    transform: translateY(-10px);
    transition: opacity .25s ease, transform .25s ease;
}

/* Bildirimin görünür hâle gelmesi */
.ust-bildirim.goster {
    opacity: 1;
    transform: translateY(0);
}

/* Bildirim simgesi */
.bildirim-simge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    width: 16px;
    font-size: 17px;
    font-weight: 700;
}

/* Bildirim türlerine göre simge renkleri */
.ust-bildirim.olumlu .bildirim-simge {
    color: #4ade80;
}

.ust-bildirim.bilgi .bildirim-simge {
    color: #60a5fa;
}

.ust-bildirim.uyari .bildirim-simge {
    color: #fbbf24;
}

.ust-bildirim.olumsuz .bildirim-simge {
    color: #f87171;
}


/* =========================================================
   3. SİNEMATİK SÜRE GÖSTERGESİ
   ========================================================= */

#cinematic-timer {
    position: absolute;
    right: 85px;
    bottom: 12px;
    background: #444444;
    color: #fff;
    padding: 3px 6px;
    font-family: Arial, sans-serif;
    font-size: 10px;
    border-radius: 4px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .3);
    z-index: 1000;
    pointer-events: none;
    letter-spacing: .3px;
    border: 1px solid rgba(255, 255, 255, .1);
    height: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
}


/* =========================================================
   4. UÇUŞ MODALI VE ANA KART
   ========================================================= */

/* Uçuş penceresinin genel konumu */
.ucus-modal {
    position: fixed;
    inset: 0;
    z-index: 10000;
    display: flex;
    align-items: flex-start;
    justify-content: flex-start;
    padding: 10px;
    background: transparent;
    pointer-events: none;
    font-family: Arial, sans-serif;
}

/* Uçuş ayar kartı */
.ucus-modal-kart {
    width: 250px;
    max-width: 94vw;
    max-height: 80vh;
    overflow-y: auto;
    padding: 9px;
    border-radius: 7px;
    background: rgba(17, 24, 39, 0.96);
    color: #fff;
    pointer-events: auto;
}

/* Uçuş kartı başlıkları */
.ucus-modal-kart h2 {
    margin: 0 0 6px;
    font-size: 15px;
}

.ucus-modal-kart h3 {
    margin: 5px 0;
    color: #38bdf8;
    font-size: 12px;
}

/* Durak ekleme ve uçuş başlatma butonlarının temel stili */
#durak-ekle-btn,
#ucus-baslat-btn {
    width: 100%;
    padding: 7px;
    margin-top: 5px;
    border: 0;
    border-radius: 4px;
    cursor: pointer;
    font-size: 11px;
    font-weight: normal;
}

/* Durak ekleme butonu */
#durak-ekle-btn {
    background: #374151;
    color: white;
}

/* Normal uçuş butonunun temel rengi */
#ucus-baslat-btn {
    background: #0284c7;
    color: white;
}


/* =========================================================
   5. ROTA KARTLARI VE DURAK GİRİŞLERİ
   ========================================================= */

/* Her bir rota kartı */
.rota-kart {
    padding: 7px;
    margin-bottom: 6px;
    border: 1px solid #374151;
    border-radius: 5px;
}

/* Durak başlığı */
.durak-baslik {
    margin: 0 0 5px;
    color: #38bdf8;
    font-size: 12px;
}

/* Rota kartındaki alan etiketleri */
.rota-kart label {
    display: block;
    margin-top: 5px;
    margin-bottom: 2px;
    font-size: 10px;
}

/* Rota kartındaki metin girişleri */
.rota-kart input {
    width: 100%;
    box-sizing: border-box;
    padding: 6px;
    font-size: 11px;
    border: 1px solid #4b5563;
    border-radius: 4px;
    background: #1f2937;
    color: white;
}

/* Durak silme butonu */
.durak-sil-btn {
    margin-top: 6px;
    padding: 5px 8px;
    border: 1px solid #ef4444;
    border-radius: 4px;
    background: #7f1d1d;
    color: white;
    font-size: 10px;
    cursor: pointer;
}


/* =========================================================
   6. KAMERA AYARLARI
   ========================================================= */

/* Kamera ayarlarının iki sütunlu düzeni */
.kamera-ayar {
    display: grid;
    grid-template-columns: 1fr 90px;
    gap: 5px 8px;
    align-items: center;
    padding: 7px;
    margin-bottom: 8px;
    background: #1f2937;
    border-radius: 5px;
}

/* Kamera ayarı etiketleri */
.kamera-ayar label {
    font-size: 11px;
}

/* Kamera ayarı girişleri */
.kamera-ayar input {
    width: 100%;
    min-width: 0;
    box-sizing: border-box;
    padding: 5px;
    border: 1px solid #4b5563;
    border-radius: 4px;
    background: #111827;
    color: white;
    font-size: 11px;
}


/* =========================================================
   7. UÇUŞ AYARLARI VE PROJE YÖNETİMİ BUTONLARI
   ========================================================= */

/* Uçuş ayar butonlarını yan yana dizer */
.ucus-ayar-butonlari {
    display: flex;
    flex-direction: row;
    gap: 6px;
    width: 100%;
    margin-top: 8px;
}

/* Uçuş ayar butonlarının ortak görünümü */
.ucus-ayar-butonlari button {
    display: block;
    flex: 1;
    min-width: 0;
    margin: 0;
    padding: 8px 2px;
    border: none;
    border-radius: 5px;
    background: #2563eb;
    color: #fff;
    font-size: 10px;
    font-weight: normal;
    line-height: 1.2;
    white-space: nowrap;
    cursor: pointer;
}

/* Uçuş ayarlarını yükleme butonu */
.ucus-ayar-butonlari #ucus-ayar-yukle-btn {
    background: #475569;
}

/* Uçuş bilgilerini silme butonu */
.ucus-ayar-butonlari #ucus-bilgileri-sil-btn {
    background: #dc2626;
}

/* GeoJSON ekleme ve bilgi düzenleme butonları */
#geojson-ekle-btn,
#bilgiler-duzenle-btn {
    flex: 1;
    min-width: 0;
    padding: 7px;
    border: 0;
    border-radius: 4px;
    background: #374151;
    color: white;
    cursor: pointer;
    font-size: 10px;
    font-weight: normal;
}


/* =========================================================
   8. UÇUŞ BAŞLATMA BUTONLARI
   ========================================================= */

.ucus-baslat-butonlari {
    display: flex !important;
    flex-direction: row !important;
    gap: 6px !important;
    width: 100% !important;
    margin-top: 8px !important;
    align-items: center !important;
}

.ucus-baslat-butonlari button {
    all: unset !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    flex: 1 !important;
    height: 30px !important;
    box-sizing: border-box !important;
    background-color: #2563eb !important;
    color: #ffffff !important;
    font-family: Arial, sans-serif !important;
    font-size: 10px !important;
    font-weight: normal !important;
    border-radius: 5px !important;
    cursor: pointer !important;
    text-align: center !important;
    white-space: nowrap !important;
}

.ucus-baslat-butonlari button:hover {
    background-color: #1d4ed8 !important;
}

/* =========================================================
   9. BİLGİLER MODALI VE KARTI
   ========================================================= */

/* Bilgi penceresinin dış alanı */
#bilgiler-modal {
    position: fixed;
    inset: 0;
    z-index: 10000;
    background: rgba(0, 0, 0, 0.65);
    align-items: center;
    justify-content: center;
    padding: 12px;
}

/* Bilgi düzenleme kartı */
.bilgiler-kart {
    box-sizing: border-box;
    width: min(440px, 94vw);
    max-height: 85vh;
    overflow-y: auto;
    padding: 14px;
    border-radius: 9px;
    background: #0f172a;
    color: white;
    border: 1px solid #38bdf8;
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
}

/* Bilgi kartı başlığı */
.bilgiler-baslik {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
}

.bilgiler-baslik h3 {
    margin: 0;
    font-size: 16px;
}

/* Bilgi modalını kapatma butonu */
#bilgi-kapat {
    flex-shrink: 0;
    width: 30px;
    height: 30px;
    border: none;
    border-radius: 5px;
    background: #334155;
    color: white;
    font-size: 19px;
    cursor: pointer;
}

#bilgi-kapat:hover {
    background: #dc2626;
}


/* =========================================================
   10. BİLGİ SATIRLARI VE GİRİŞ ALANLARI
   ========================================================= */

/* Bilgi satırlarının sütun düzeni */
.bilgi-satir {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 36px 68px 76px 40px;
    gap: 5px;
    align-items: center;
    margin-bottom: 8px;
}

/* Bilgi satırlarındaki giriş ve seçim alanları */
.bilgi-satir input,
.bilgi-satir select {
    box-sizing: border-box;
    width: 100%;
    min-width: 0;
    height: 32px;
    padding: 4px;
    border: 1px solid #475569;
    border-radius: 4px;
    background: #1e293b;
    color: white;
    font-size: 12px;
}

/* Bilgi metninin tam satır kaplaması */
.bilgi-satir .bilgi-metni {
    grid-column: 1 / -1;
    height: 34px;
    padding: 6px 8px;
    font-size: 13px;
}

/* Renk seçiciler */
.bilgi-satir input[type="color"] {
    height: 32px;
    padding: 2px;
}

/* Bilgi satırındaki onay kutusu ve etiketi */
.bilgi-satir label {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: #cbd5e1;
}

.bilgi-satir label input {
    width: 15px;
    height: 15px;
}


/* =========================================================
   11. BİLGİ MODALI ALT BUTONLARI
   ========================================================= */

/* Alt butonların yan yana dizilmesi */
.bilgi-modal-butonlar {
    display: flex;
    gap: 8px;
    margin-top: 12px;
}

/* Genel alt buton stili */
.bilgi-modal-butonlar button,
.bilgi-sil {
    padding: 8px 10px;
    border: 0;
    border-radius: 5px;
    color: white;
    background: #334155;
    font-size: 12px;
    cursor: pointer;
}

/* Tamam butonu */
#bilgi-tamam {
    margin-left: auto;
    background: #0284c7;
}

/* Buton yazılarının tek satırda kalması */
#bilgi-kapat,
#bilgi-satir-ekle,
#bilgi-tamam,
.bilgi-sil {
    white-space: nowrap;
}

/* Tamam butonu üzerine gelindiğinde */
#bilgi-tamam:hover {
    background: #0369a1;
}

/* Silme butonu üzerine gelindiğinde */
.bilgi-sil:hover {
    background: #dc2626;
}


/* =========================================================
   12. BİLGİ MODALI TELEFON EKRANI DÜZENİ
   ========================================================= */

@media (max-width: 480px) {
    .bilgiler-kart {
        width: 94vw;
        padding: 12px;
    }

    .bilgi-satir {
        grid-template-columns: minmax(0, 1fr) 36px 68px 40px;
        gap: 5px;
    }

    .bilgi-satir .bilgi-kalinligi {
        grid-column: 1 / 3;
    }

    .bilgi-satir .bilgi-sil {
        grid-column: 4;
    }
}


/* =========================================================
   13. UÇUŞ MODALI BAŞLIĞI VE KAPATMA BUTONU
   ========================================================= */

/* Uçuş kartının konumu ve imleç davranışı */
#ucus-modal .ucus-modal-kart {
    position: absolute;
    cursor: default;
}

/* Sürüklenebilir başlık */
#ucus-modal .ucus-modal-kart h2 {
    cursor: move;
    user-select: none;
}

/* Başlık ve kapatma butonunun yerleşimi */
.ucus-modal-baslik {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
}

.ucus-modal-baslik h2 {
    margin: 0;
}

/* Uçuş modalını kapatma butonu */
#ucus-modal-kapat {
    flex-shrink: 0;
    width: 30px;
    height: 30px;
    border: none;
    border-radius: 5px;
    background: #334155;
    color: #fff;
    font-size: 19px;
    cursor: pointer;
}

#ucus-modal-kapat:hover {
    background: #dc2626;
}


/* =========================================================
   14. UÇUŞ VE BİLGİ MODALLARI KAYDIRMA ÇUBUKLARI
   ========================================================= */

/* Firefox için ince kaydırma çubuğu */
#ucus-modal .ucus-modal-kart,
#bilgiler-modal .bilgiler-kart {
    scrollbar-width: thin;
    scrollbar-color: #94a3b8 transparent;
}

/* Chrome, Edge ve Safari için kaydırma çubuğu genişliği */
#ucus-modal .ucus-modal-kart::-webkit-scrollbar,
#bilgiler-modal .bilgiler-kart::-webkit-scrollbar {
    width: 6px;
}

/* Kaydırma çubuğunun arka planı */
#ucus-modal .ucus-modal-kart::-webkit-scrollbar-track,
#bilgiler-modal .bilgiler-kart::-webkit-scrollbar-track {
    background: transparent;
    margin: 10px 0;
}

/* Kaydırma tutamacı */
#ucus-modal .ucus-modal-kart::-webkit-scrollbar-thumb,
#bilgiler-modal .bilgiler-kart::-webkit-scrollbar-thumb {
    background: #94a3b8;
    border-radius: 10px;
    border: 1px solid transparent;
    background-clip: padding-box;
}

/* Kaydırma tutamacı üzerine gelindiğinde */
#ucus-modal .ucus-modal-kart::-webkit-scrollbar-thumb:hover,
#bilgiler-modal .bilgiler-kart::-webkit-scrollbar-thumb:hover {
    background: #64748b;
    background-clip: padding-box;
}


/* =========================================================
   15. ANLIK ZOOM GÖSTERGESİ
   ========================================================= */

#anlik-zoom {
    position: absolute;
    right: 12px;
    bottom: 12px;
    background: #444444;
    color: #fff;
    padding: 3px 6px;
    font-family: Arial, sans-serif;
    font-size: 10px;
    border-radius: 4px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .3);
    z-index: 1000;
    pointer-events: none;
    letter-spacing: .3px;
    border: 1px solid rgba(255, 255, 255, .1);
    height: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
}


/* =========================================================
   16. HARİTA LOGOSU
   ========================================================= */

/* Logo ana kutusu */
#logo {
    position: fixed;
    left: 12px;
    bottom: 58px;
    z-index: 1000;
    width: 110px;
    height: auto;
    padding: 5px 5px;
    background: #444444;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    border-radius: 0;
}

/* Logo ana yazısı */
#logo .logo-ana {
    margin: 0;
    padding: 0;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0;
    line-height: 1.2;
    white-space: nowrap;
    text-shadow: 1px 1px 1px #555555;
}

/* Logo altın renkli yazısı */
#logo .logo-altin {
    color: #D8CCAE;
}

/* Logo beyaz yazısı */
#logo .logo-beyaz {
    color: #FFFFFF !important;
    text-shadow: none !important;
    opacity: 1 !important;
}

/* Logo alt açıklaması */
#logo .logo-alt {
    margin: 0;
    padding: 0;
    color: #D8CCAE;
    font-size: 7px;
    letter-spacing: 1px;
    line-height: 1.2;
    white-space: nowrap;
}


/* =========================================================
   17. UÇUŞ PROJESİ DIŞA AKTARMA VE İÇE AKTARMA
   ========================================================= */

/* Export ve Import butonlarının ortak stili */
#ucus-export-btn,
#ucus-import-btn {
    flex: 1;
    min-width: 0;
    padding: 7px;
    border: 0;
    border-radius: 4px;
    color: #fff;
    cursor: pointer;
    font-size: 10px;
    font-weight: normal;
    line-height: 1.2;
    white-space: nowrap;
}

/* Dışa aktarma butonu */
#ucus-export-btn {
    background: #2563eb;
}

/* İçe aktarma butonu */
#ucus-import-btn {
    background: #475569;
}

/* Dışa aktarma hover rengi */
#ucus-export-btn:hover {
    background: #1d4ed8;
}

/* İçe aktarma hover rengi */
#ucus-import-btn:hover {
    background: #334155;
}


	
</style>
</head>

<body>
<div id="map"></div>
<div id="cinematic-timer">00:00.00</div>
<div id="anlik-zoom">Zoom: 13.0</div>

<!-- UÇUŞ BİLGİLERİ MODALI -->

<div id="ucus-modal" class="ucus-modal">
    <div class="ucus-modal-kart">
        <div class="ucus-modal-baslik">
			<h2>Uçuş Bilgileri</h2>
			<button type="button" id="ucus-modal-kapat"
					title="Kapat">✕</button>
		</div>

        <h3>Kamera Ayarları</h3>

        <div class="kamera-ayar">
            <label for="baslangic-zoom">Başlangıç Zoom</label>
            <input type="number" id="baslangic-zoom"
                   min="1" max="22" step="0.5" value="17">

            <label for="ucus-zoom">Uçuş Zoom</label>
            <input type="number" id="ucus-zoom"
                   min="1" max="22" step="0.5" value="18">

            <label for="kamera-acisi">Kamera Açısı</label>
            <input type="number" id="kamera-acisi"
                   min="0" max="85" step="1" value="60">

            <label for="kamera-yonu">Kamera Yönü</label>
            <input type="number" id="kamera-yonu"
                   min="0" max="360" step="5" value="0">
        </div>

        <h3>Rotalar</h3>

        <div id="rota-listesi"></div>

        <button type="button" id="durak-ekle-btn">
            + Durak Ekle
        </button>
				
		
		<div class="ucus-ayar-butonlari">
			<button type="button" id="ucus-ayar-kaydet-btn">Uçuş Kaydet</button>
			<button type="button" id="ucus-ayar-yukle-btn">Uçuş Yükle</button>
			<button type="button" id="ucus-bilgileri-sil-btn" onclick="ucusBilgileriniSil()">Bilgileri sil</button>
		</div>
		
		<div style="display:flex; gap:6px; margin-top:6px;">
			<button type="button" id="geojson-ekle-btn" style="flex:1;">
				GeoJSON Ekle
			</button>

			<button type="button" id="bilgiler-duzenle-btn" style="flex:1;">
				Tanıtım Bilgileri
			</button>
		</div>

		<input type="file" id="geojson-dosya-input"
			   accept=".geojson,.json,application/geo+json,application/json"
			   style="display:none;">
			   
		<div style="display:flex; gap:6px; margin-top:6px;">
			<button type="button" id="ucus-export-btn" style="flex:1;">
				Export
			</button>

			<button type="button" id="ucus-import-btn" style="flex:1;">
				Import
			</button>
		</div>
		<input type="file" id="ucus-import-dosya"
		   accept=".json,application/json"
		   style="display:none;">


        <div class="ucus-baslat-butonlari">
			<button type="button" id="ucus-baslat-btn">Uçuşu Başlat</button>
			<button type="button" id="ucus-baslat-webm-btn">Videolu Uçuşu Başlat</button>
		</div>
    </div>
</div>

<div id="bilgiler-modal" style="display:none;">
    <div class="bilgiler-kart">

        <div class="bilgiler-baslik">
            <h3>Tanıtım Bilgileri</h3>
            <button type="button" id="bilgi-kapat"
                    title="Kaydetmeden kapat">✕</button>

function rotalariOku() {
    const kartlar = document.querySelectorAll('#rota-listesi .rota-kart');
    const rotalar = [];

    for (let i = 0; i < kartlar.length; i++) {
        const kart = kartlar[i];

        const ad = kart.querySelector('.durak-adi').value.trim();
        const koordinatMetni = kart.querySelector('.durak-koordinat').value.trim();
        const sureMetni = kart.querySelector('.durak-suresi').value.trim();
        const etiket = kart.querySelector('.durak-etiket').value.trim();

        if (!ad || !koordinatMetni) {
            bildirimGoster(`${i + 1}. durağın adı ve koordinatı girilmelidir.`, 'uyari');
            return null;
        }

        const koordinatlar = koordinatMetni.split(',').map(v => Number(v.trim()));

        if (
            koordinatlar.length !== 2 ||
            !koordinatlar.every(Number.isFinite) ||
            koordinatlar[0] < -180 ||
            koordinatlar[0] > 180 ||
            koordinatlar[1] < -90 ||
            koordinatlar[1] > 90
        ) {
            bildirimGoster(`${i + 1}. durağın koordinatı hatalı. Örnek: 34.038831, 38.352797`, 'uyari');
            return null;
        }

        let sure = null;

        if (i < kartlar.length - 1) {
            sure = Number(sureMetni);

            if (!sureMetni || !Number.isFinite(sure) || sure <= 0) {
                bildirimGoster(`${i + 1}. durağın sonraki durağa uçuş süresi saniye olarak girilmelidir.`, 'uyari');
                return null;
            }
        }

        rotalar.push({
            ad: ad,
            koordinat: koordinatlar,
            sure: sure,
            etiket: etiket
        });
    }

    if (rotalar.length < 2) {
        bildirimGoster('Uçuş için en az iki durak eklemelisin.', 'uyari');
        return null;
    }

    return rotalar;
}



let ucusRotalari = [];
let ucusBaslatildi = false;


let ucusAnimasyonFrame = null;
let ucusBaslangicZamani = null;
let aktifDurakIndex = 0;
let ucusDurdu = false;

function kameraYonunuHesapla(baslangic, hedef) {
    return turf.bearing(
        turf.point(baslangic),
        turf.point(hedef)
    );
}



function kameraAyarlariniOku() {

        baslangicZoom < 1 || baslangicZoom > 22 ||

        kameraYonu < 0 || kameraYonu > 360
    ) {
        bildirimGoster('Kamera ayarlarını kontrol et.', 'uyari');
        return null;
    }

    return { baslangicZoom, ucusZoom, kameraAcisi, kameraYonu };
}





function ucusAnimasyonunuBaslat(rota, ayarlar) {
    if (!rota || rota.length < 2) return;
	
	ucusEtiketleriniHaritayaEkle(rota);

    if (ucusAnimasyonFrame) {
        cancelAnimationFrame(ucusAnimasyonFrame);
        ucusAnimasyonFrame = null;
    }

    ucusBaslatildi = true;
    ucusDurdu = false;
    aktifDurakIndex = 0;

    const dronePitch = Number(ayarlar.kameraAcisi) || 60;
    const ucusZoom = Number(ayarlar.ucusZoom) || 19;
    const baslangicZoom = Number(ayarlar.baslangicZoom) || 17;

    function easeInOutQuad(t) {
        return t < 0.5
            ? 2 * t * t
            : -1 + (4 - 2 * t) * t;
    }

    function lerp(a, b, t) {
        return a + (b - a) * t;
    }

    function lerpBearing(a, b, t) {
        const fark = ((b - a + 540) % 360) - 180;
        return a + fark * t;
    }

    const bacaklar = rota.slice(0, -1).map((durak, i) => ({
        baslangic: rota[i].koordinat,
        hedef: rota[i + 1].koordinat,
        sure: Math.max(0.1, Number(durak.sure) || 10) * 1000,
        bearingBaslangic: 0,
        bearingHedef: 0
    }));

    let toplamUcusSuresi = bacaklar.reduce(
        (toplam, bacak) => toplam + bacak.sure,
        0
    );

    // Her bacağın yönünü ve toplam süre içindeki bitiş oranını hesapla
    let birikenSure = 0;

    bacaklar.forEach((bacak, i) => {
        bacak.bearingHedef = kameraYonunuHesapla(
            bacak.baslangic,
            bacak.hedef
        );

        bacak.bearingBaslangic = i === 0
            ? (Number(ayarlar.kameraYonu) || bacak.bearingHedef)
            : bacaklar[i - 1].bearingHedef;

        birikenSure += bacak.sure;
        bacak.bitisOrani = birikenSure / toplamUcusSuresi;
    });

    map.jumpTo({
        center: rota[0].koordinat,
        zoom: baslangicZoom,
        pitch: dronePitch,
        bearing: Number(ayarlar.kameraYonu) || bacaklar[0].bearingHedef
    });

    document.getElementById('ucus-modal').style.display = 'none';

    // Kronometre 5 saniyelik hazırlık süresini de sayar
    const kronometreBaslangici = performance.now();

    function kronometreGuncelle() {
        if (!ucusBaslatildi) return;

        const gecen = performance.now() - kronometreBaslangici;
        const dakika = Math.floor(gecen / 60000);
        const saniye = Math.floor((gecen % 60000) / 1000);
        const salise = Math.floor((gecen % 1000) / 10);
        const ekran = document.getElementById('cinematic-timer');

        if (ekran) {
            ekran.textContent =
                `${String(dakika).padStart(2, '0')}:` +
                `${String(saniye).padStart(2, '0')}.` +
                `${String(salise).padStart(2, '0')}`;
        }

        kronometreFrame = requestAnimationFrame(kronometreGuncelle);
    }

    let kronometreFrame = requestAnimationFrame(kronometreGuncelle);

	setTimeout(() => {
		if (!ucusBaslatildi) return;

		playSmoothColoredListFlow(tanitimBilgileri, () => {
			if (!ucusBaslatildi) return;

			const ucusBaslangicZamani = performance.now();

			function frame(zaman) {
				if (!ucusBaslatildi) return;

				const gecenSure = zaman - ucusBaslangicZamani;
				let kalanSure = gecenSure;
				let bacakIndex = 0;

				while (
					bacakIndex < bacaklar.length - 1 &&
					kalanSure >= bacaklar[bacakIndex].sure
				) {
					kalanSure -= bacaklar[bacakIndex].sure;
					bacakIndex++;
				}

				const bacak = bacaklar[bacakIndex];
				const t = Math.min(1, kalanSure / bacak.sure);
				const smoothT = easeInOutQuad(t);

				const currentLng = lerp(bacak.baslangic[0], bacak.hedef[0], smoothT);
				const currentLat = lerp(bacak.baslangic[1], bacak.hedef[1], smoothT);
				const currentBearing = lerpBearing(
					bacak.bearingBaslangic,
					bacak.bearingHedef,
					smoothT
				);

				const sonBacak = bacakIndex === bacaklar.length - 1;
				const zoomT = sonBacak ? smoothT : 0;
				const currentZoom = lerp(
					ucusZoom,
					Math.min(ucusZoom + 1, 20),
					zoomT
				);

				aktifDurakIndex = bacakIndex + 1;

				map.jumpTo({
					center: [currentLng, currentLat],
					zoom: currentZoom,
					pitch: dronePitch,
					bearing: currentBearing
				});

				if (gecenSure < toplamUcusSuresi) {
					ucusAnimasyonFrame = requestAnimationFrame(frame);
				} else {
					const sonDurak = rota[rota.length - 1];

					map.jumpTo({
						center: sonDurak.koordinat,
						zoom: currentZoom,
						pitch: dronePitch,
						bearing: bacak.bearingHedef
					});

					ucusBaslatildi = false;
					cancelAnimationFrame(kronometreFrame);
					ucusAnimasyonFrame = null;
					ucusKaydiniDurdur();
					
					setTimeout(function () {
						document.getElementById('ucus-modal').style.display = 'flex';
					}, 10000);
				}
			}

			ucusAnimasyonFrame = requestAnimationFrame(frame);
		});
	}, 5000);
}

async function gercekMp4Olustur(webmBlob) {
    console.log('[MP4] Dönüştürme fonksiyonu başladı.');

    if (!mp4Donusturucu) {
        console.log('[MP4] FFmpeg yükleniyor...');

        const { FFmpeg } = await import(
            './ffmpeg/ffmpeg/index.js'
        );

        mp4Donusturucu = new FFmpeg();

        mp4Donusturucu.on('log', ({ message }) => {
            console.log('[FFmpeg]', message);
        });

        mp4Donusturucu.on('progress', ({ progress }) => {
            console.log(
                '[MP4] İlerleme:',
                Math.round(progress * 100) + '%'
            );
        });

                try {
				const kok = location.origin;

				console.log('[MP4] Core dosyası yükleniyor...');

				await mp4Donusturucu.load({
					coreURL: kok + '/ffmpeg/core/ffmpeg-core.js?v=esm1',
					wasmURL: kok + '/ffmpeg/core/ffmpeg-core.wasm',
					classWorkerURL: kok + '/ffmpeg/ffmpeg/worker.js'
				});

				console.log('[MP4] FFmpeg hazır.');

			} catch (e) {
				console.error('[MP4] FFmpeg yükleme hatası:', e);
				mp4Donusturucu = null;
				throw e;
			}
    }

    console.log('[MP4] WebM dosyası hazırlanıyor...');

    await mp4Donusturucu.writeFile(
        'ucus.webm',
        new Uint8Array(await webmBlob.arrayBuffer())
    );

    console.log('[MP4] H.264 MP4 dönüşümü başladı...');

    await mp4Donusturucu.exec([
        '-i', 'ucus.webm',
        '-map', '0:v:0',
        '-an',
        '-c:v', 'libx264',
        '-preset', 'ultrafast',
        '-crf', '23',
        '-vf', 'scale=trunc(iw/2)*2:trunc(ih/2)*2',
        '-pix_fmt', 'yuv420p',
        '-profile:v', 'baseline',
        '-level', '3.1',
        '-tag:v', 'avc1',
        '-movflags', '+faststart',
        '-f', 'mp4',
        'ucus.mp4'
    ]);

    console.log('[MP4] Sonuç okunuyor...');

    const sonuc = await mp4Donusturucu.readFile('ucus.mp4');

    if (!sonuc || sonuc.length === 0) {
        throw new Error('Dönüştürülen MP4 dosyası boş.');
    }

    console.log(
        '[MP4] Dönüşüm tamamlandı:',
        Math.round(sonuc.length / 1024),
        'KB'
    );

    return new Blob([sonuc], {
        type: 'video/mp4'
    });
}








// Çakışmayı önlemek için değişkenleri global scope'ta güvenli tanımlıyoruz
window.ucusKayitRecorder = window.ucusKayitRecorder || null;
window.ucusKayitAkis = window.ucusKayitAkis || null;
window.ucusKayitParcalari = window.ucusKayitParcalari || [];
window.ucusKayitBaslatiliyor = window.ucusKayitBaslatiliyor || false;

async function ucusKaydiniHazirla() {
    if (!navigator.mediaDevices?.getDisplayMedia) {
        bildirimGoster('Tarayıcınız ekran kaydını desteklemiyor.', 'uyari');
        return;
    }

    window.ucusKayitBaslatiliyor = true;

    try {
        window.ucusKayitAkis = await navigator.mediaDevices.getDisplayMedia({
            video: {
                displaySurface: "browser",
                frameRate: { ideal: 30, max: 30 }
            },
            audio: false,
            preferCurrentTab: true
        });

        window.ucusKayitParcalari = [];

        let secilenTur = 'video/webm';
        const olasiTurler = [
			'video/webm;codecs=vp9',
			'video/webm;codecs=vp8',
			'video/webm'
		];
        for (let tur of olasiTurler) {
            if (MediaRecorder.isTypeSupported(tur)) {
                secilenTur = tur;
                break;
            }
        }

        window.ucusKayitRecorder = new MediaRecorder(window.ucusKayitAkis, {
            mimeType: secilenTur,
            videoBitsPerSecond: 12000000
        });

        window.ucusKayitRecorder.ondataavailable = olay => {
            if (olay.data && olay.data.size > 0) {
                window.ucusKayitParcalari.push(olay.data);
            }
        };

        
		window.ucusKayitRecorder.onstop = async () => {
			window.ucusKayitBaslatiliyor = false;

			const kayit = window.ucusKayitRecorder;
			const kayitTuru = kayit?.mimeType || secilenTur;

			const hamBlob = new Blob(window.ucusKayitParcalari, {
				type: kayitTuru
			});

			try {
				if (!hamBlob.size) {
					throw new Error('Kayıt verisi boş.');
				}

				let sonucBlob;

				if (kayitTuru.includes('mp4')) {
					sonucBlob = hamBlob;
				} else {
					console.log('WebM kaydı gerçek MP4 formatına dönüştürülüyor...');
					sonucBlob = await gercekMp4Olustur(hamBlob);
				}

				if (!sonucBlob.size) {
					throw new Error('MP4 dosyası boş oluştu.');
				}

				const url = URL.createObjectURL(sonucBlob);
				const link = document.createElement('a');

				link.href = url;
				link.download = 'ennetmax_ucus_kaydi.mp4';

				document.body.appendChild(link);
				link.click();
				link.remove();

				setTimeout(() => URL.revokeObjectURL(url), 60000);

				console.log(
					'MP4 indirildi:',
					Math.round(sonucBlob.size / 1024),
					'KB'
				);

			} catch (err) {
				console.error('MP4 dönüşümünün gerçek hatası:', err);

				const webmBlob = new Blob(window.ucusKayitParcalari, {
					type: kayitTuru
				});

				if (webmBlob.size > 0) {
					const url = URL.createObjectURL(webmBlob);
					const link = document.createElement('a');

					link.href = url;
					link.download = 'ennetmax_ucus_kaydi.webm';

					document.body.appendChild(link);
					link.click();
					link.remove();

					setTimeout(() => URL.revokeObjectURL(url), 60000);
				}

				bildirimGoster('MP4 dönüşümü başarısız. F12 > Console bölümündeki kırmızı hataya bak.', 'olumsuz');
			} finally {
				window.ucusKayitAkis?.getTracks().forEach(track => track.stop());

				window.ucusKayitRecorder = null;
				window.ucusKayitAkis = null;
				window.ucusKayitParcalari = [];
				window.ucusKayitBaslatiliyor = false;
			}
		};


        window.ucusKayitAkis.getVideoTracks()[0].addEventListener('ended', () => {
            if (window.ucusKayitRecorder?.state === 'recording') {
                window.ucusKayitRecorder.stop();
            }
        });

        window.ucusKayitRecorder.start(1000);

    } catch (err) {
        window.ucusKayitBaslatiliyor = false;
        console.error("Kayıt başlatılamadı:", err);
    }
}

function ucusKaydiniDurdur() {
    window.ucusKayitBaslatiliyor = false;
    if (window.ucusKayitRecorder && window.ucusKayitRecorder.state === 'recording') {
        window.ucusKayitRecorder.stop();
    }
}

function ucusAyarlariniYukle() {
    const kayit = localStorage.getItem(UCUS_AYAR_KAYIT_ANAHTARI);

    if (!kayit) {
        bildirimGoster('Kayıtlı uçuş ayarı bulunamadı.', 'bilgi');
        return;
    }

    try {
        const ayarlar = JSON.parse(kayit);

        document.getElementById('baslangic-zoom').value = ayarlar.baslangicZoom ?? 17;
        document.getElementById('ucus-zoom').value = ayarlar.ucusZoom ?? 18;
        document.getElementById('kamera-acisi').value = ayarlar.kameraAcisi ?? 60;
        document.getElementById('kamera-yonu').value = ayarlar.kameraYonu ?? 0;

        rotaListesi.innerHTML = '';

        if (Array.isArray(ayarlar.duraklar) && ayarlar.duraklar.length) {
            ayarlar.duraklar.forEach(durak => {
                durakEkle();

                const kartlar = rotaListesi.querySelectorAll('.rota-kart');
                const kart = kartlar[kartlar.length - 1];

                kart.querySelector('.durak-adi').value = durak.ad ?? '';
                kart.querySelector('.durak-koordinat').value = durak.koordinat ?? '';
                kart.querySelector('.durak-suresi').value = durak.sure ?? '';
                kart.querySelector('.durak-etiket').value = durak.etiket ?? '';
            });
        } else {
            durakEkle();
        }

        rotaBasliklariniGuncelle();
        bildirimGoster('Kayıtlı uçuş ayarları yüklendi.', 'olumlu');
    } catch (hata) {
        bildirimGoster('Kayıtlı ayarlar okunamadı.', 'olumsuz');
    }
}

function create3DMarkerWithPulse(coordinates, titleText) {
    const el = document.createElement('div');
    el.className = 'sky-universal-label';

    const text = document.createElement('span');
    text.className = 'label-main';

    // HTML içine ham metin basılmaz; satır sonları güvenli işlenir.
    String(titleText ?? '')
        .split(/\\n|\n|\r\n/)
        .slice(0, 2)
        .map(s => s.trim())
        .filter(Boolean)
        .forEach((line, i) => {
            if (i > 0) text.appendChild(document.createElement('br'));
            text.appendChild(document.createTextNode(line));
        });

    const container = document.createElement('div');
    container.className = 'marker-container';

    const textContainer = document.createElement('div');
    textContainer.className = 'text-container';
    textContainer.appendChild(text);

    const pulseWrapper = document.createElement('div');
    pulseWrapper.className = 'pulse-wrapper';
    pulseWrapper.innerHTML = `
        <div class="pulse-ring"></div>
        <div class="pulse-core"></div>
    `;

    container.appendChild(textContainer);
    container.appendChild(pulseWrapper);
    el.appendChild(container);

    if (!document.getElementById('universal-marker-style')) {
        const style = document.createElement('style');
        style.id = 'universal-marker-style';
        style.textContent = `
            .sky-universal-label {
                pointer-events:none;
                user-select:none;
            }
            .marker-container {
                display:flex;
                flex-direction:column;
                align-items:center;
                position:relative;
            }
            .text-container {
                display:flex;
                align-items:center;
                justify-content:center;
                animation:universalFloat 3s ease-in-out infinite;
                margin-bottom:12px;
            }
            .label-main {
                font-family:Arial,sans-serif;
                font-size:26px;
                font-weight:800;
                color:#fff;
                letter-spacing:0;
                text-transform:uppercase;
                display:inline-block;
                -webkit-text-stroke:1.2px #0f172a;
                text-shadow:0 2px 4px rgba(15,23,42,.9), 0 6px 14px rgba(0,0,0,.85);
                text-align:center;
                line-height:1.4;
            }
            .pulse-wrapper {
                position:relative;
                width:36px;
                height:36px;
                display:flex;
                align-items:center;
                justify-content:center;
            }
            .pulse-core {
                width:12px;
                height:12px;
                background:#38bdf8;
                border-radius:50%;
                box-shadow:0 0 12px #38bdf8, inset 0 0 4px rgba(255,255,255,.8);
                z-index:2;
            }
            .pulse-ring {
                position:absolute;
                inset:0;
                margin:auto;
                width:36px;
                height:36px;
                border:2px solid #38bdf8;
                border-radius:50%;
                animation:universalPulseWave 2s infinite ease-out;
                opacity:.8;
                z-index:1;
            }
            @keyframes universalPulseWave {
                0% { transform:scale(.5); opacity:1; }
                100% { transform:scale(2.4); opacity:0; }
            }
            @keyframes universalFloat {
                0%,100% { transform:translateY(0); }
                50% { transform:translateY(-6px); }
            }
        `;
        document.head.appendChild(style);
    }

    new mapboxgl.Marker({
        element: el,
        anchor: 'bottom',
        pitchAlignment: 'viewport',
        rotationAlignment: 'viewport'
    })
    .setLngLat(coordinates)
    .addTo(map);
}

        }

        secimKutusu.addEventListener('click', function (e) {

    secimKutusu.style.display = 'flex';

    const mesaj = secimKutusu.querySelector('#geojson-github-mesaj');
    const ekleBtn = secimKutusu.querySelector('#geojson-github-ekle');

    liste.innerHTML = '<option value="">Dosyalar yükleniyor...</option>';

    ekleBtn.disabled = true;

        }

        const dosyalar = await cevap.json();

        geojsonDosyalari = dosyalar.filter(d =>
            d.type === 'file' &&
            /\.(geojson|json)$/i.test(d.name)
        );

        liste.innerHTML = '';

        if (!geojsonDosyalari.length) {

        }

        geojsonDosyalari.forEach((dosya, index) => {

            secenek.value = String(index);
            secenek.textContent = dosya.name;
            liste.appendChild(secenek);
        });

        mesaj.textContent = geojsonDosyalari.length + ' dosya bulundu.';
        ekleBtn.disabled = false;

    } catch (hata) {
        console.error('GitHub GeoJSON listesi alınamadı:', hata);
        liste.innerHTML = '<option value="">Dosyalar yüklenemedi</option>';
        mesaj.textContent = hata.message;
        return;
    }

    ekleBtn.onclick = async () => {
        const secilenIndex = liste.value;

        if (secilenIndex === '') {
            mesaj.textContent = 'Önce bir dosya seç.';
            return;
        }

        const dosya = geojsonDosyalari[Number(secilenIndex)];
        if (!dosya) return;

        ekleBtn.disabled = true;
        mesaj.textContent = dosya.name + ' indiriliyor...';

        try {
            const dosyaCevap = await fetch(dosya.download_url);

            if (!dosyaCevap.ok) {
                throw new Error('GeoJSON dosyası indirilemedi.');
            }

            const geojson = await dosyaCevap.json();

            // GeoJSON verisini FeatureCollection biçimine getir
            let veri = geojson;

            if (geojson.type === 'Polygon' || geojson.type === 'MultiPolygon') {
                veri = {
                    type: 'FeatureCollection',
                    features: [{
                        type: 'Feature',
                        properties: {},
                        geometry: geojson
                    }]
                };
            } else if (geojson.type === 'GeometryCollection') {
                veri = {
                    type: 'FeatureCollection',
                    features: geojson.geometries.map(geometri => ({
                        type: 'Feature',
                        properties: {},
                        geometry: geometri
                    }))
                };
            } else if (geojson.type === 'Feature') {
                veri = {
                    type: 'FeatureCollection',
                    features: [geojson]
                };
            }

            if (!Array.isArray(veri.features) || veri.features.length === 0) {
                throw new Error('GeoJSON içinde gösterilecek geometri bulunamadı.');
            }

            const kaynakId = 'hedef-parsel-geojson';
            const dolguId = 'hedef-parsel-dolgu';
            const haloId = 'hedef-parsel-halo';
            const sinirId = 'hedef-parsel-sinir';

            // Önceki animasyonu durdur
            if (window.parselHaloAnimasyonu) {
                cancelAnimationFrame(window.parselHaloAnimasyonu);
                window.parselHaloAnimasyonu = null;
            }

            // Önceki katmanları ve kaynağı kaldır
            [sinirId, haloId, dolguId].forEach(id => {
                if (map.getLayer(id)) map.removeLayer(id);
            });

            if (map.getSource(kaynakId)) {
                map.removeSource(kaynakId);
            }

            map.addSource(kaynakId, {
                type: 'geojson',
                data: veri
            });

            // Parsel dolgusu
            map.addLayer({
                id: dolguId,
                type: 'fill',
                source: kaynakId,
                filter: [
                    'any',
                    ['==', ['geometry-type'], 'Polygon'],
                    ['==', ['geometry-type'], 'MultiPolygon']
                ],
                paint: {
                    'fill-color': '#0284c7',
                    'fill-opacity': 0.25
                }
            });

            // Turkuaz halo
            map.addLayer({
                id: haloId,
                type: 'line',
                source: kaynakId,
                filter: [
                    'any',
                    ['==', ['geometry-type'], 'Polygon'],
                    ['==', ['geometry-type'], 'MultiPolygon']
                ],
                layout: {
                    'line-join': 'round',
                    'line-cap': 'round'
                },
                paint: {
                    'line-color': '#0891b2',
                    'line-width': 10,
                    'line-opacity': 0.95
                }
            });

            // Beyaz parsel sınırı
            map.addLayer({
                id: sinirId,
                type: 'line',
                source: kaynakId,
                filter: [
                    'any',
                    ['==', ['geometry-type'], 'Polygon'],
                    ['==', ['geometry-type'], 'MultiPolygon']
                ],
                layout: {
                    'line-join': 'round',
                    'line-cap': 'round'
                },
                paint: {
                    'line-color': '#ffffff',
                    'line-width': 4,
                    'line-opacity': 1
                }
            });

            // GeoJSON koordinatlarını topla
            const koordinatlar = [];

            function koordinatlariTara(deger) {
                if (!Array.isArray(deger)) return;

                if (
                    deger.length >= 2 &&
                    typeof deger[0] === 'number' &&
                    typeof deger[1] === 'number'
                ) {
                    koordinatlar.push(deger);
                    return;
                }

                deger.forEach(koordinatlariTara);
            }

            function geometriKoordinatlariniTara(geometri) {
                if (!geometri) return;

                if (geometri.type === 'GeometryCollection') {
                    geometri.geometries.forEach(geometriKoordinatlariniTara);
                } else {
                    koordinatlariTara(geometri.coordinates);
                }
            }

            veri.features.forEach(feature => {
                geometriKoordinatlariniTara(feature.geometry);
            });

            if (koordinatlar.length === 0) {
                throw new Error('GeoJSON koordinatları bulunamadı.');
            }

            const sinirlar = new mapboxgl.LngLatBounds();

            koordinatlar.forEach(koordinat => {
                sinirlar.extend([koordinat[0], koordinat[1]]);
            });

            map.fitBounds(sinirlar, {
                padding: 70,
                maxZoom: 19,
                duration: 1800
            });

            // Halo animasyonu
            let baslangicZamani = null;

            function haloAnimasyonunuCalistir(zaman) {
                if (!map.getLayer(haloId)) {
                    window.parselHaloAnimasyonu = null;
                    return;
                }

                if (baslangicZamani === null) {
                    baslangicZamani = zaman;
                }

                const oran = ((zaman - baslangicZamani) % 1600) / 1600;
                const parlaklik = (1 - Math.cos(oran * Math.PI * 2)) / 2;

                map.setPaintProperty(haloId, 'line-width', 7 + parlaklik * 7);
                map.setPaintProperty(haloId, 'line-opacity', 0.4 + parlaklik * 0.55);

                window.parselHaloAnimasyonu =
                    requestAnimationFrame(haloAnimasyonunuCalistir);
            }

            window.parselHaloAnimasyonu =
                requestAnimationFrame(haloAnimasyonunuCalistir);

            console.log('Yüklenen GeoJSON:', veri);
            bildirimGoster('GeoJSON haritaya eklendi: ' + dosya.name, 'olumlu');

            secimKutusu.style.display = 'none';

        } catch (hata) {
            console.error('GeoJSON yükleme hatası:', hata);
            mesaj.textContent = 'Dosya yüklenemedi: ' + hata.message;
            bildirimGoster('GeoJSON yüklenemedi: ' + hata.message, 'olumsuz');
        } finally {
            ekleBtn.disabled = false;
        }
    };
});




(function () {
    const modalKart = document.querySelector(
        '#ucus-modal .ucus-modal-kart'
    );
    const baslik = modalKart?.querySelector('h2');

    if (!modalKart || !baslik) return;

    let surukleniyor = false;
    let baslangicX = 0;
    let baslangicY = 0;
    let kartX = 0;
    let kartY = 0;

    baslik.addEventListener('mousedown', function (e) {
        if (e.button !== 0) return;

        const rect = modalKart.getBoundingClientRect();

        surukleniyor = true;
        baslangicX = e.clientX;
        baslangicY = e.clientY;
        kartX = rect.left;
        kartY = rect.top;

        modalKart.style.position = 'fixed';
        modalKart.style.left = kartX + 'px';
        modalKart.style.top = kartY + 'px';
        modalKart.style.margin = '0';

        e.preventDefault();
    });

    document.addEventListener('mousemove', function (e) {
        if (!surukleniyor) return;

        const yeniX = kartX + e.clientX - baslangicX;
        const yeniY = kartY + e.clientY - baslangicY;

        modalKart.style.left = Math.max(
            0, Math.min(yeniX, window.innerWidth - modalKart.offsetWidth)
        ) + 'px';

        modalKart.style.top = Math.max(
            0, Math.min(yeniY, window.innerHeight - modalKart.offsetHeight)
        ) + 'px';
    });

    document.addEventListener('mouseup', function () {
        surukleniyor = false;
    });
})();

                <option value="14">14 px</option>
                <option value="16">16 px</option>

                <option value="28">28 px</option>
                <option value="32">32 px</option>
            </select>

            <select class="bilgi-kalinligi" title="Yazı kalınlığı">
                <option value="400">Normal</option>
                <option value="500">Orta</option>
                <option value="600">Yarı kalın</option>
                <option value="700">Kalın</option>
                <option value="800">Çok kalın</option>
            </select>

            <button type="button" class="bilgi-sil">Sil</button>

            <label>
                <input type="checkbox" class="bilgi-rozet">
                Rozet olarak göster
            </label>
        `;

        satir.querySelector('.bilgi-metni').value = bilgi.text ?? '';
        satir.querySelector('.bilgi-rengi').value = bilgi.color ?? '#ffffff';
        satir.querySelector('.bilgi-boyutu').value = String(bilgi.size ?? '16');
        satir.querySelector('.bilgi-kalinligi').value = String(bilgi.weight ?? '500');
        satir.querySelector('.bilgi-rozet').checked = Boolean(bilgi.isBadge);

        satir.querySelector('.bilgi-sil').addEventListener('click', () => {
            satir.remove();
        });
		
		satir.addEventListener('dragstart', function (e) {
			satir.style.opacity = '0.5';
			e.dataTransfer.setData(
				'text/plain',
				Array.from(bilgiSatirlari.children).indexOf(satir)
			);
			e.dataTransfer.effectAllowed = 'move';
		});

		satir.addEventListener('dragend', function () {
			satir.style.opacity = '1';
		});

		satir.addEventListener('dragover', function (e) {
			e.preventDefault();
			e.dataTransfer.dropEffect = 'move';
		});

		satir.addEventListener('drop', function (e) {
			e.preventDefault();

			const kaynakIndex = Number(e.dataTransfer.getData('text/plain'));
			const satirlar = Array.from(bilgiSatirlari.children);
			const kaynakSatir = satirlar[kaynakIndex];

			if (!kaynakSatir || kaynakSatir === satir) return;

			const hedefRect = satir.getBoundingClientRect();
			const altaBirak = e.clientY > hedefRect.top + hedefRect.height / 2;

			if (altaBirak) {
				satir.after(kaynakSatir);
			} else {
				satir.before(kaynakSatir);
			}
		});

        bilgiSatirlari.appendChild(satir);
    });
}

function bildirimGoster(mesaj, tur = 'bilgi', sure = 3000) {
    let alan = document.getElementById('ust-bildirim-alani');

    if (!alan) {
        alan = document.createElement('div');
        alan.id = 'ust-bildirim-alani';
        document.body.appendChild(alan);
    }

    const simgeler = {
        olumlu: '✓',
        bilgi: '−',
        uyari: '!',
        olumsuz: '×'
    };

    const bildirim = document.createElement('div');
    bildirim.className = `ust-bildirim ${tur}`;

    const simge = document.createElement('span');
    simge.className = 'bildirim-simge';
    simge.textContent = simgeler[tur] || simgeler.bilgi;

    const yazi = document.createElement('span');
    yazi.textContent = mesaj;

    bildirim.append(simge, yazi);
    alan.appendChild(bildirim);

    requestAnimationFrame(() => bildirim.classList.add('goster'));

    setTimeout(() => {
        bildirim.classList.remove('goster');
        setTimeout(() => bildirim.remove(), 300);
    }, sure);
}



document.getElementById('ucus-export-btn').addEventListener('click', function () {
    try {
	
		const dosyaAdi = prompt(
            'Uçuş dosyasının adını yazın:',
            'Ennetmax_Ucus'
        );

        // İptal edilirse dışa aktarma işlemini durdur.
        if (dosyaAdi === null) return;

        // Boş bırakılırsa varsayılan adı kullan.
        const temizDosyaAdi = dosyaAdi.trim() || 'Ennetmax_Ucus';
	
        // Tanıtım penceresinde düzenleme varsa güncel satırları al.
        const satirlar = document.querySelectorAll(
            '#bilgi-satirlari .bilgi-satir'
        );

        if (satirlar.length > 0) {
            tanitimBilgileriniOku();
        }

        // Ekrandaki güncel uçuş ayarlarını al.
        const ucusAyarlari = {
            baslangicZoom: document.getElementById('baslangic-zoom').value,
            ucusZoom: document.getElementById('ucus-zoom').value,
            kameraAcisi: document.getElementById('kamera-acisi').value,
            kameraYonu: document.getElementById('kamera-yonu').value,
            duraklar: Array.from(
                document.querySelectorAll('#rota-listesi .rota-kart')
            ).map(function (kart) {
                return {
                    ad: kart.querySelector('.durak-adi')?.value || '',
                    koordinat: kart.querySelector('.durak-koordinat')?.value || '',
                    sure: kart.querySelector('.durak-suresi')?.value || '',
                    etiket: kart.querySelector('.durak-etiket')?.value || ''
                };
            })
        };

        const proje = {
            format: 'ennetmax-ucus-projesi',
            version: 1,
            ucusAyarlari: ucusAyarlari,
            tanitimBilgileri: tanitimBilgileri
        };

        const blob = new Blob(
            [JSON.stringify(proje, null, 2)],
            { type: 'application/json;charset=utf-8' }
        );

        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');

        link.href = url;
        link.download = temizDosyaAdi.replace(/[\\/:*?"<>|]/g, '_') + '.json';
        document.body.appendChild(link);
        link.click();

        setTimeout(function () {
            URL.revokeObjectURL(url);
        }, 1000);

        bildirimGoster('Uçuş JSON dosyasına aktarıldı.', 'olumlu');

    } catch (hata) {
        console.error('Export hatası:', hata);
        bildirimGoster('JSON dışa aktarma başarısız.', 'olumsuz');
    }
});

                bildirimGoster(
                    'Lütfen önce bir dosya adı seçin.',
                    'olumsuz'
                );
                liste.focus();
                return;
            }

            ekleBtn.disabled = true;
            iptalBtn.disabled = true;
            liste.disabled = true;

            ekleBtn.textContent = 'Yükleniyor...';
            ekleBtn.style.opacity = '0.7';
            ekleBtn.style.cursor = 'wait';

            try {
                // Seçilen JSON dosyasını GitHub'dan oku.
                const dosyaCevap = await fetch(liste.value);

                if (!dosyaCevap.ok) {
                    throw new Error('GitHub JSON dosyası okunamadı.');
                }

                const veri = await dosyaCevap.json();

                // Mevcut JSON doğrulaması.
                if (
                    veri.format !== 'ennetmax-ucus-projesi' ||
                    veri.version !== 1 ||
                    !veri.ucusAyarlari ||
                    !Array.isArray(veri.ucusAyarlari.duraklar) ||
                    !Array.isArray(veri.tanitimBilgileri)
                ) {
                    throw new Error('JSON dosya biçimi geçersiz.');
                }

                const ayarlar = veri.ucusAyarlari;

                for (const alan of [
                    'baslangicZoom',
                    'ucusZoom',
                    'kameraAcisi',
                    'kameraYonu'
                ]) {
                    if (!Number.isFinite(Number(ayarlar[alan]))) {
                        throw new Error('Kamera ayarı geçersiz: ' + alan);
                    }
                }

                for (const durak of ayarlar.duraklar) {
                    if (
                        !durak ||
                        typeof durak.ad !== 'string' ||
                        typeof durak.koordinat !== 'string'
                    ) {
                        throw new Error('Durak bilgisi geçersiz.');
                    }

                    const koordinat = durak.koordinat.split(',').map(Number);

                    if (
                        koordinat.length !== 2 ||
                        !koordinat.every(Number.isFinite) ||
                        koordinat[0] < -180 ||
                        koordinat[0] > 180 ||
                        koordinat[1] < -90 ||
                        koordinat[1] > 90
                    ) {
                        throw new Error(
                            'Geçersiz koordinat: ' + durak.koordinat
                        );
                    }
                }

                for (const bilgi of veri.tanitimBilgileri) {
                    if (
                        !bilgi ||
                        typeof bilgi.text !== 'string' ||
                        typeof bilgi.color !== 'string' ||
                        !Number.isFinite(Number(bilgi.size)) ||
                        !Number.isFinite(Number(bilgi.weight)) ||
                        typeof bilgi.isBadge !== 'boolean'
                    ) {
                        throw new Error('Tanıtım bilgisi geçersiz.');
                    }
                }

                // Mevcut kayıt anahtarlarına kaydet.
                localStorage.setItem(
                    UCUS_AYAR_KAYIT_ANAHTARI,
                    JSON.stringify(ayarlar)
                );

                localStorage.setItem(
                    BILGI_KAYIT_ANAHTARI,
                    JSON.stringify(veri.tanitimBilgileri)
                );

                // Mevcut yükleme fonksiyonları.
                ucusAyarlariniYukle();

                tanitimBilgileri = veri.tanitimBilgileri;

                const bilgiModal = document.getElementById('bilgiler-modal');

                if (bilgiModal && bilgiModal.style.display !== 'none') {
                    bilgiSatirlariniGoster();
                }

                modalKapat();

                bildirimGoster(
                    'GitHub uçuş ve tanıtım bilgileri içe aktarıldı.',
                    'olumlu'
                );

            } catch (hata) {
                console.error('Import hatası:', hata);

                bildirimGoster(
                    hata.message || 'Dosya yüklenemedi.',
                    'olumsuz'
                );

                // Hata durumunda yeniden seçim yapılabilsin.
                ekleBtn.disabled = false;
                iptalBtn.disabled = false;
                liste.disabled = false;

                ekleBtn.textContent = 'Tekrar Dene';
                ekleBtn.style.opacity = '1';
                ekleBtn.style.cursor = 'pointer';
            }
        };
    } catch (hata) {
        console.error('GitHub import hatası:', hata);

        bildirimGoster(
            'GitHub klasörü okunamadı. Depo herkese açık mı kontrol et.',
            'olumsuz'
        );
    }
});




</script>
</body>
</html>
