<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Ennetmax - 3D Drone Uçuş Simülasyonu</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">

    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
	

<style>
 
/* =========================================================
   1. TEMEL SAYFA VE HARİTA
   ========================================================= */

body {
    margin: 0;
    padding: 0;
}

#map {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 100%;
}


/* =========================================================
   2. ÜST BİLDİRİM ALANI
   ========================================================= */

/* Bildirimlerin ekranda konumlandırılması */
#ust-bildirim-alani {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 999999;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    width: max-content;
    max-width: calc(100vw - 24px);
    pointer-events: none;
}

/* Bildirim kutusu */
.ust-bildirim {
    display: flex;
    align-items: center;
    gap: 8px;
    width: fit-content;
    max-width: 100%;
    box-sizing: border-box;
    padding: 4px 8px;
    border-radius: 3px;
    background: #F2F4F7;
    color: #263445;
    border: 1px solid #D1D5DB;
    box-shadow: 0 5px 18px rgba(0, 0, 0, 0.35);
    font-family: Tahoma, sans-serif;
    font-size: 12px;
    opacity: 0;
    transform: translateY(-10px);
    transition: opacity .25s ease, transform .25s ease;
}

/* Bildirimin görünür hâle gelmesi */
.ust-bildirim.goster {
    opacity: 1;
    transform: translateY(0);
}

/* Bildirim simgesi */
.bildirim-simge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    width: 16px;
    font-size: 17px;
    font-weight: 700;
}

/* Bildirim türlerine göre simge renkleri */
.ust-bildirim.olumlu .bildirim-simge {
    color: #4ade80;
}

.ust-bildirim.bilgi .bildirim-simge {
    color: #60a5fa;
}

.ust-bildirim.uyari .bildirim-simge {
    color: #fbbf24;
}

.ust-bildirim.olumsuz .bildirim-simge {
    color: #f87171;
}


/* =========================================================
   3. SİNEMATİK SÜRE GÖSTERGESİ
   ========================================================= */

#cinematic-timer {
    position: absolute;
    right: 82px;
    bottom: 12px;
    background: #444444;
    color: #fff;
    padding: 3px 6px;
    font-family: 'Consolas', monospace;
    font-size: 10px;
    border-radius: 4px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .3);
    z-index: 1000;
    pointer-events: none;
    letter-spacing: .3px;
    border: 1px solid rgba(255, 255, 255, .1);
    height: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
}


/* =========================================================
   4. UÇUŞ MODALI VE ANA KART
   ========================================================= */

/* Uçuş penceresinin genel konumu */
.ucus-modal {
    position: fixed;
    inset: 0;
    z-index: 10000;
    display: flex;
    align-items: flex-start;
    justify-content: flex-start;
    padding: 10px;
    background: transparent;
    pointer-events: none;
    font-family: Arial, sans-serif;
}

/* Uçuş ayar kartı */
.ucus-modal-kart {
    width: 250px;
    max-width: 94vw;
    max-height: 80vh;
    overflow-y: auto;
    padding: 9px;
    border-radius: 7px;
    background: rgba(17, 24, 39, 0.96);
    color: #fff;
    pointer-events: auto;
}

/* Uçuş kartı başlıkları */
.ucus-modal-kart h2 {
    margin: 0 0 6px;
    font-size: 15px;
}

.ucus-modal-kart h3 {
    margin: 5px 0;
    color: #38bdf8;
    font-size: 12px;
}

/* Durak ekleme ve uçuş başlatma butonlarının temel stili */
#durak-ekle-btn,
#ucus-baslat-btn {
    width: 100%;
    padding: 7px;
    margin-top: 5px;
    border: 0;
    border-radius: 4px;
    cursor: pointer;
    font-size: 11px;
    font-weight: normal;
}

/* Durak ekleme butonu */
#durak-ekle-btn {
    background: #374151;
    color: white;
}

/* Normal uçuş butonunun temel rengi */
#ucus-baslat-btn {
    background: #0284c7;
    color: white;
}


/* =========================================================
   5. ROTA KARTLARI VE DURAK GİRİŞLERİ
   ========================================================= */

/* Her bir rota kartı */
.rota-kart {
    padding: 7px;
    margin-bottom: 6px;
    border: 1px solid #374151;
    border-radius: 5px;
}

/* Durak başlığı */
.durak-baslik {
    margin: 0 0 5px;
    color: #38bdf8;
    font-size: 12px;
}

/* Rota kartındaki alan etiketleri */
.rota-kart label {
    display: block;
    margin-top: 5px;
    margin-bottom: 2px;
    font-size: 10px;
}

/* Rota kartındaki metin girişleri */
.rota-kart input {
    width: 100%;
    box-sizing: border-box;
    padding: 6px;
    font-size: 11px;
    border: 1px solid #4b5563;
    border-radius: 4px;
    background: #1f2937;
    color: white;
}

/* Durak silme butonu */
.durak-sil-btn {
    margin-top: 6px;
    padding: 5px 8px;
    border: 1px solid #ef4444;
    border-radius: 4px;
    background: #7f1d1d;
    color: white;
    font-size: 10px;
    cursor: pointer;
}


/* =========================================================
   6. KAMERA AYARLARI
   ========================================================= */

/* Kamera ayarlarının iki sütunlu düzeni */
.kamera-ayar {
    display: grid;
    grid-template-columns: 1fr 90px;
    gap: 5px 8px;
    align-items: center;
    padding: 7px;
    margin-bottom: 8px;
    background: #1f2937;
    border-radius: 5px;
}

/* Kamera ayarı etiketleri */
.kamera-ayar label {
    font-size: 11px;
}

/* Kamera ayarı girişleri */
.kamera-ayar input {
    width: 100%;
    min-width: 0;
    box-sizing: border-box;
    padding: 5px;
    border: 1px solid #4b5563;
    border-radius: 4px;
    background: #111827;
    color: white;
    font-size: 11px;
}


/* =========================================================
   7. UÇUŞ AYARLARI VE PROJE YÖNETİMİ BUTONLARI
   ========================================================= */

.ucus-ayar-butonlari {
    display: flex;
    flex-direction: row;
    gap: 6px;
    width: 100%;
    margin-top: 8px;
}

.ucus-ayar-butonlari {
    display: flex;
    flex-direction: row;
    gap: 6px;
    width: 100%;
    margin-top: 8px;
}

.ucus-ayar-butonlari button {
    display: block;
    flex: 1;
    min-width: 0;
    margin: 0;
    padding: 8px 2px;
    border: none;
    border-radius: 5px;
    background: #64748b;
    color: #fff;
    font-size: 10px;
    font-weight: normal;
    line-height: 1.2;
    white-space: nowrap;
    cursor: pointer;
    transition: background 0.2s ease;
}

.ucus-ayar-butonlari button:hover,
.ucus-ayar-butonlari #ucus-ayar-yukle-btn:hover,
.ucus-ayar-butonlari #ucus-bilgileri-sil-btn:hover {
    background: #000 !important;
}





/* GeoJSON, Yol Yazıları ve Tanıtım butonlarının bulunduğu alan */
#geojson-ekle-btn,
#yol-yazilari-ac-btn,
#bilgiler-duzenle-btn {
    display: block;
    flex: 1;
    min-width: 0;
    min-height: 32px;
    box-sizing: border-box;
    margin: 0;
    padding: 7px 3px;
    border: 0;
    border-radius: 4px;
    background: #374151;
    color: #fff;
    cursor: pointer;
    font-size: 10px;
    font-weight: normal;
    transition: background 0.2s ease;
}



#geojson-ekle-btn:hover,
#yol-yazilari-ac-btn:hover,
#bilgiler-duzenle-btn:hover {
    background: #000;
}

/* Bu üç butonu saran mevcut div */
#ucus-modal .ucus-modal-kart > div:has(> #geojson-ekle-btn) {
    display: flex;
    align-items: stretch;
    gap: 5px;
    width: 100%;
    box-sizing: border-box;
    margin-top: 10px;
    margin-bottom: 10px;
}


/* =========================================================
   8. UÇUŞ BAŞLATMA BUTONLARI
   ========================================================= */

.ucus-baslat-butonlari {
    display: flex !important;
    flex-direction: row !important;
    gap: 6px !important;
    width: 100% !important;
    margin-top: 8px !important;
    align-items: center !important;
}

.ucus-baslat-butonlari button {
    all: unset !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    flex: 1 !important;
    height: 30px !important;
    box-sizing: border-box !important;
    background-color: #2563eb !important;
    color: #ffffff !important;
    font-family: Arial, sans-serif !important;
    font-size: 10px !important;
    font-weight: normal !important;
    border-radius: 5px !important;
    cursor: pointer !important;
    text-align: center !important;
    white-space: nowrap !important;
}

.ucus-baslat-butonlari button:hover {
    background-color: #1d4ed8 !important;
}


/* =========================================================
   9. BİLGİLER MODALI VE KARTI
   ========================================================= */

/* Bilgi penceresinin dış alanı */
#bilgiler-modal {
    position: fixed;
    inset: 0;
    z-index: 10000;
    background: rgba(0, 0, 0, 0.65);
    align-items: center;
    justify-content: center;
    padding: 12px;
}

/* Bilgi düzenleme kartı */
.bilgiler-kart {
    box-sizing: border-box;
    width: min(440px, 94vw);
    max-height: 85vh;
    overflow-y: auto;
    padding: 14px;
    border-radius: 9px;
    background: #0f172a;
    color: white;
    border: 1px solid #38bdf8;
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
}

/* Bilgi kartı başlığı */
.bilgiler-baslik {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
}

.bilgiler-baslik h3 {
    margin: 0;
    font-size: 16px;
}

/* Bilgi modalını kapatma butonu */
#bilgi-kapat {
    flex-shrink: 0;
    width: 30px;
    height: 30px;
    border: none;
    border-radius: 5px;
    background: #334155;
    color: white;
    font-size: 19px;
    cursor: pointer;
}

#bilgi-kapat:hover {
    background: #dc2626;
}


/* =========================================================
   10. BİLGİ SATIRLARI VE GİRİŞ ALANLARI
   ========================================================= */

/* Bilgi satırlarının sütun düzeni */
.bilgi-satir {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 36px 68px 76px 40px;
    gap: 5px;
    align-items: center;
    margin-bottom: 8px;
}

/* Bilgi satırlarındaki giriş ve seçim alanları */
.bilgi-satir input,
.bilgi-satir select {
    box-sizing: border-box;
    width: 100%;
    min-width: 0;
    height: 32px;
    padding: 4px;
    border: 1px solid #475569;
    border-radius: 4px;
    background: #1e293b;
    color: white;
    font-size: 12px;
}

/* Bilgi metninin tam satır kaplaması */
.bilgi-satir .bilgi-metni {
    grid-column: 1 / -1;
    height: 34px;
    padding: 6px 8px;
    font-size: 13px;
}

/* Renk seçiciler */
.bilgi-satir input[type="color"] {
    height: 32px;
    padding: 2px;
}

/* Bilgi satırındaki onay kutusu ve etiketi */
.bilgi-satir label {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: #cbd5e1;
}

.bilgi-satir label input {
    width: 15px;
    height: 15px;
}

/* =========================================================
   11. BİLGİ MODALI ALT BUTONLARI
   ========================================================= */

/* Alt butonların yan yana dizilmesi */
.bilgi-modal-butonlar {
    display: flex;
    gap: 8px;
    margin-top: 12px;
}

/* Genel alt buton stili */
.bilgi-modal-butonlar button,
.bilgi-sil {
    padding: 8px 10px;
    border: 0;
    border-radius: 5px;
    color: white;
    background: #334155;
    font-size: 12px;
    cursor: pointer;
}

/* Tamam butonu */
#bilgi-tamam {
    margin-left: auto;
    background: #0284c7;
}

/* Buton yazılarının tek satırda kalması */
#bilgi-kapat,
#bilgi-satir-ekle,
#bilgi-tamam,
.bilgi-sil {
    white-space: nowrap;
}

/* Tamam butonu üzerine gelindiğinde */
#bilgi-tamam:hover {
    background: #0369a1;
}

/* Silme butonu üzerine gelindiğinde */
.bilgi-sil:hover {
    background: #dc2626;
}


/* =========================================================
   12. BİLGİ MODALI TELEFON EKRANI DÜZENİ
   ========================================================= */

@media (max-width: 480px) {
    .bilgiler-kart {
        width: 94vw;
        padding: 12px;
    }

    .bilgi-satir {
        grid-template-columns: minmax(0, 1fr) 36px 68px 40px;
        gap: 5px;
    }

    .bilgi-satir .bilgi-kalinligi {
        grid-column: 1 / 3;
    }

    .bilgi-satir .bilgi-sil {
        grid-column: 4;
    }
}


/* =========================================================
   13. UÇUŞ MODALI BAŞLIĞI VE KAPATMA BUTONU
   ========================================================= */

/* Uçuş kartının konumu ve imleç davranışı */
#ucus-modal .ucus-modal-kart {
    position: absolute;
    cursor: default;
}

/* Sürüklenebilir başlık */
#ucus-modal .ucus-modal-kart h2 {
    cursor: move;
    user-select: none;
}

/* Başlık ve kapatma butonunun yerleşimi */
.ucus-modal-baslik {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
}

.ucus-modal-baslik h2 {
    margin: 0;
}

/* Uçuş modalını kapatma butonu */
#ucus-modal-kapat {
    flex-shrink: 0;
    width: 30px;
    height: 30px;
    border: none;
    border-radius: 5px;
    background: #334155;
    color: #fff;
    font-size: 19px;
    cursor: pointer;
}

#ucus-modal-kapat:hover {
    background: #dc2626;
}


/* =========================================================
   14. UÇUŞ VE BİLGİ MODALLARI KAYDIRMA ÇUBUKLARI
   ========================================================= */

/* Firefox için ince kaydırma çubuğu */
#ucus-modal .ucus-modal-kart,
#bilgiler-modal .bilgiler-kart {
    scrollbar-width: thin;
    scrollbar-color: #94a3b8 transparent;
}

/* Chrome, Edge ve Safari için kaydırma çubuğu genişliği */
#ucus-modal .ucus-modal-kart::-webkit-scrollbar,
#bilgiler-modal .bilgiler-kart::-webkit-scrollbar {
    width: 6px;
}

/* Kaydırma çubuğunun arka planı */
#ucus-modal .ucus-modal-kart::-webkit-scrollbar-track,
#bilgiler-modal .bilgiler-kart::-webkit-scrollbar-track {
    background: transparent;
    margin: 10px 0;
}

/* Kaydırma tutamacı */
#ucus-modal .ucus-modal-kart::-webkit-scrollbar-thumb,
#bilgiler-modal .bilgiler-kart::-webkit-scrollbar-thumb {
    background: #94a3b8;
    border-radius: 10px;
    border: 1px solid transparent;
    background-clip: padding-box;
}

/* Kaydırma tutamacı üzerine gelindiğinde */
#ucus-modal .ucus-modal-kart::-webkit-scrollbar-thumb:hover,
#bilgiler-modal .bilgiler-kart::-webkit-scrollbar-thumb:hover {
    background: #64748b;
    background-clip: padding-box;
}


/* =========================================================
   15. ANLIK ZOOM GÖSTERGESİ
   ========================================================= */

#anlik-zoom {
    position: absolute;
    right: 12px;
    bottom: 12px;
    background: #444444;
    color: #fff;
    padding: 3px 6px;
    font-family: 'Roboto', sans-serif;
    font-size: 10px;
    border-radius: 4px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .3);
    z-index: 1000;
    pointer-events: none;
    letter-spacing: .3px;
    border: 1px solid rgba(255, 255, 255, .1);
    height: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
}


/* =========================================================
   16. HARİTA LOGOSU
   ========================================================= */

/* Logo ana kutusu */
#logo {
    position: fixed;
    left: 12px;
    bottom: 58px;
    z-index: 1000;
    width: 110px;
    height: auto;
    padding: 15px 5px;
    background: #444444;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    border-radius: 0;
}

/* Logo ana yazısı */
#logo .logo-ana {
    margin: 0;
    padding: 0;
    font-size: 16px;
	font-family: 'Inter', sans-serif;
    font-weight: 700;
    letter-spacing: 0;
    line-height: 1.2;
    white-space: nowrap;
    text-shadow: 1px 1px 1px #555555;
}

/* Logo altın renkli yazısı */
#logo .logo-altin {
    color: #D8CCAE;
}

/* Logo beyaz yazısı */
#logo .logo-beyaz {
    color: #FFFFFF !important;
    text-shadow: none !important;
    opacity: 1 !important;
}

/* Logo alt açıklaması */
#logo .logo-alt {
    margin: 0;
    padding: 0;
    color: #D8CCAE;
    font-size: 7.2px;
	font-family: 'Inter', sans-serif;
    letter-spacing: 1px;
    line-height: 1.7;
    white-space: nowrap;
}


/* =========================================================
   17. UÇUŞ PROJESİ DIŞA AKTARMA VE İÇE AKTARMA
   ========================================================= */

/* Export ve Import butonlarının ortak stili */
#ucus-export-btn,
#ucus-import-btn {
    flex: 1;
    min-width: 0;
    padding: 7px;
    border: 0;
    border-radius: 4px;
    color: #fff;
    cursor: pointer;
    font-size: 10px;
    font-weight: normal;
    line-height: 1.2;
    white-space: nowrap;
}

/* Export ve Import ortak zemin rengi */
#ucus-export-btn,
#ucus-import-btn {
    background: #0e7490;
    transition: background 0.2s ease;
}

/* İki butonun ortak hover rengi */
#ucus-export-btn:hover,
#ucus-import-btn:hover {
    background: #0891b2;
}


/* =====================================
   YOL YAZISI MODALI
   Kompakt ve modern tasarım
===================================== */

.yol-yazisi-modal-arka {
    position: fixed;
    inset: 0;
    z-index: 10001;
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    padding: 12px;
    background: transparent;
    pointer-events: none;
}

.yol-yazisi-modal-kutu {
    position: relative;
    box-sizing: border-box;
    width: 100%;
    max-width: 350px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 15px;
    background: #ffffff;
    color: #1e293b;
    border: 1px solid #dbeafe;
    border-radius: 13px;
    box-shadow: 0 12px 32px rgba(30, 64, 175, 0.20);
    font-family: Arial, sans-serif;
    pointer-events: auto;
}

/* Başlık */
.yol-yazisi-modal-baslik {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin: -15px -15px 14px;
    padding: 13px 15px;
    border-radius: 12px 12px 0 0;
    background: linear-gradient(120deg, #2563eb, #0891b2);
    color: #ffffff;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.2px;
    cursor: move;
    user-select: none;
    touch-action: none;
}

/* Kapatma düğmesi */
.yol-yazisi-modal-kapat {
    display: flex;
    flex-shrink: 0;
    align-items: center;
    justify-content: center;
    width: 27px;
    height: 27px;
    padding: 0;
    border: 0;
    border-radius: 7px;
    background: rgba(255, 255, 255, 0.2);
    color: #ffffff;
    font-size: 23px;
    line-height: 1;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
}

.yol-yazisi-modal-kapat:hover {
    background: #ffffff;
    color: #2563eb;
}

/* Etiketler */
.yol-yazisi-modal-kutu label {
    display: block;
    margin: 10px 0 5px;
    color: #475569;
    font-size: 11px;
    font-weight: 700;
}

/* Giriş alanları */
.yol-yazisi-modal-kutu input {
    display: block;
    box-sizing: border-box;
    width: 100%;
    min-width: 0;
    height: 37px;
    padding: 8px 10px;
    border: 1px solid #cbd5e1;
    border-radius: 7px;
    outline: none;
    background: #f8fafc;
    color: #0f172a;
    font-family: Arial, sans-serif;
    font-size: 13px;
    transition: border-color 0.2s, box-shadow 0.2s;
}

function rotalariOku() {
    const kartlar = document.querySelectorAll('#rota-listesi .rota-kart');
    const rotalar = [];

    for (let i = 0; i < kartlar.length; i++) {
        const kart = kartlar[i];

        const ad = kart.querySelector('.durak-adi').value.trim();
        const koordinatMetni = kart.querySelector('.durak-koordinat').value.trim();
        const sureMetni = kart.querySelector('.durak-suresi').value.trim();
        const etiket = kart.querySelector('.durak-etiket').value.trim();

        if (!ad || !koordinatMetni) {
            bildirimGoster(`${i + 1}. durağın adı ve koordinatı girilmelidir.`, 'uyari');
            return null;
        }

        const koordinatlar = koordinatMetni.split(',').map(v => Number(v.trim()));

        if (
            koordinatlar.length !== 2 ||
            !koordinatlar.every(Number.isFinite) ||
            koordinatlar[0] < -180 ||
            koordinatlar[0] > 180 ||
            koordinatlar[1] < -90 ||
            koordinatlar[1] > 90
        ) {
            bildirimGoster(`${i + 1}. durağın koordinatı hatalı. Örnek: 34.038831, 38.352797`, 'uyari');
            return null;
        }

        let sure = null;

        if (i < kartlar.length - 1) {
            sure = Number(sureMetni);

            if (!sureMetni || !Number.isFinite(sure) || sure <= 0) {
                bildirimGoster(`${i + 1}. durağın sonraki durağa uçuş süresi saniye olarak girilmelidir.`, 'uyari');
                return null;
            }
        }

        rotalar.push({
            ad: ad,
            koordinat: koordinatlar,
            sure: sure,
            etiket: etiket
        });
    }

    if (rotalar.length < 2) {
        bildirimGoster('Uçuş için en az iki durak eklemelisin.', 'uyari');
        return null;
    }

    return rotalar;
}



let ucusRotalari = [];
let ucusBaslatildi = false;


let ucusAnimasyonFrame = null;
let ucusBaslangicZamani = null;
let aktifDurakIndex = 0;
let ucusDurdu = false;

function kameraYonunuHesapla(baslangic, hedef) {
    return turf.bearing(
        turf.point(baslangic),
        turf.point(hedef)
    );
}



function kameraAyarlariniOku() {
    const baslangicZoom = Number(document.getElementById('baslangic-zoom').value);
    const ucusZoom = Number(document.getElementById('ucus-zoom').value);
    const kameraAcisi = Number(document.getElementById('kamera-acisi').value);
    const kameraYonu = Number(document.getElementById('kamera-yonu').value);

    if (
        !Number.isFinite(baslangicZoom) ||
        !Number.isFinite(ucusZoom) ||
        !Number.isFinite(kameraAcisi) ||
        !Number.isFinite(kameraYonu) ||
        baslangicZoom < 1 || baslangicZoom > 22 ||
        ucusZoom < 1 || ucusZoom > 22 ||
        kameraAcisi < 0 || kameraAcisi > 85 ||
        kameraYonu < 0 || kameraYonu > 360
    ) {
        bildirimGoster('Kamera ayarlarını kontrol et.', 'uyari');
        return null;
    }

    return { baslangicZoom, ucusZoom, kameraAcisi, kameraYonu };
}



function ucusMuziginiBaslat() {
    const muzik = document.getElementById('ucusFonMuzigi');
    if (!muzik) return;

    muzik.pause();
    muzik.currentTime = 0;
    muzik.volume = 0;

    muzik.play().then(() => {
        const baslangic = performance.now();

        function sesiAc(zaman) {
            if (muzik.paused) return;

            const oran = Math.min((zaman - baslangic) / 2000, 1);
            muzik.volume = 0.25 * oran;

            if (oran < 1) {
                requestAnimationFrame(sesiAc);
            }
        }

        requestAnimationFrame(sesiAc);
    }).catch(hata => {
        console.warn('Uçuş müziği başlatılamadı:', hata);
    });
}

function ucusMuziginiDurdur() {
    const muzik = document.getElementById('ucusFonMuzigi');
    if (!muzik || muzik.paused) return;

    const baslangicSes = muzik.volume;
    const baslangicZamani = performance.now();

    function sesiKapat(zaman) {
        const oran = Math.min((zaman - baslangicZamani) / 4000, 1);
        muzik.volume = baslangicSes * (1 - oran);

        if (oran < 1) {
            requestAnimationFrame(sesiKapat);
        } else {
            muzik.pause();
            muzik.currentTime = 0;
        }
    }

    requestAnimationFrame(sesiKapat);
}



function ucusAnimasyonunuBaslat(rota, ayarlar) {
    if (!rota || rota.length < 2) return;
	
	ucusEtiketleriniHaritayaEkle(rota);

    if (ucusAnimasyonFrame) {
        cancelAnimationFrame(ucusAnimasyonFrame);
        ucusAnimasyonFrame = null;
    }

    ucusBaslatildi = true;
    ucusDurdu = false;
    aktifDurakIndex = 0;

    const dronePitch = Number(ayarlar.kameraAcisi) || 60;
    const ucusZoom = Number(ayarlar.ucusZoom) || 19;
    const baslangicZoom = Number(ayarlar.baslangicZoom) || 17;

    function easeInOutQuad(t) {
        return t < 0.5
            ? 2 * t * t
            : -1 + (4 - 2 * t) * t;
    }

    function lerp(a, b, t) {
        return a + (b - a) * t;
    }

    function lerpBearing(a, b, t) {
        const fark = ((b - a + 540) % 360) - 180;
        return a + fark * t;
    }

    const bacaklar = rota.slice(0, -1).map((durak, i) => ({
        baslangic: rota[i].koordinat,
        hedef: rota[i + 1].koordinat,
        sure: Math.max(0.1, Number(durak.sure) || 10) * 1000,
        bearingBaslangic: 0,
        bearingHedef: 0
    }));

    let toplamUcusSuresi = bacaklar.reduce(
        (toplam, bacak) => toplam + bacak.sure,
        0
    );

    // Her bacağın yönünü ve toplam süre içindeki bitiş oranını hesapla
    let birikenSure = 0;

    bacaklar.forEach((bacak, i) => {
        bacak.bearingHedef = kameraYonunuHesapla(
            bacak.baslangic,
            bacak.hedef
        );

        bacak.bearingBaslangic = i === 0
            ? (Number(ayarlar.kameraYonu) || bacak.bearingHedef)
            : bacaklar[i - 1].bearingHedef;

        birikenSure += bacak.sure;
        bacak.bitisOrani = birikenSure / toplamUcusSuresi;
    });

    map.jumpTo({
        center: rota[0].koordinat,
        zoom: baslangicZoom,
        pitch: dronePitch,
        bearing: Number(ayarlar.kameraYonu) || bacaklar[0].bearingHedef
    });

    document.getElementById('ucus-modal').style.display = 'none';

    // Kronometre 5 saniyelik hazırlık süresini de sayar
    const kronometreBaslangici = performance.now();

    function kronometreGuncelle() {
        if (!ucusBaslatildi) return;

        const gecen = performance.now() - kronometreBaslangici;
        const dakika = Math.floor(gecen / 60000);
        const saniye = Math.floor((gecen % 60000) / 1000);
        const salise = Math.floor((gecen % 1000) / 10);
        const ekran = document.getElementById('cinematic-timer');

        if (ekran) {
            ekran.textContent =
                `${String(dakika).padStart(2, '0')}:` +
                `${String(saniye).padStart(2, '0')}.` +
                `${String(salise).padStart(2, '0')}`;
        }

        kronometreFrame = requestAnimationFrame(kronometreGuncelle);
    }

    let kronometreFrame = requestAnimationFrame(kronometreGuncelle);

	setTimeout(() => {
		if (!ucusBaslatildi) return;

		playSmoothColoredListFlow(tanitimBilgileri, () => {
			if (!ucusBaslatildi) return;

			const ucusBaslangicZamani = performance.now();

			function frame(zaman) {
				if (!ucusBaslatildi) return;

				const gecenSure = zaman - ucusBaslangicZamani;
				let kalanSure = gecenSure;
				let bacakIndex = 0;

				while (
					bacakIndex < bacaklar.length - 1 &&
					kalanSure >= bacaklar[bacakIndex].sure
				) {
					kalanSure -= bacaklar[bacakIndex].sure;
					bacakIndex++;
				}

				const bacak = bacaklar[bacakIndex];
				const t = Math.min(1, kalanSure / bacak.sure);
				const smoothT = easeInOutQuad(t);

				const currentLng = lerp(bacak.baslangic[0], bacak.hedef[0], smoothT);
				const currentLat = lerp(bacak.baslangic[1], bacak.hedef[1], smoothT);
				const currentBearing = lerpBearing(
					bacak.bearingBaslangic,
					bacak.bearingHedef,
					smoothT
				);

				const sonBacak = bacakIndex === bacaklar.length - 1;
				const zoomT = sonBacak ? smoothT : 0;
				const currentZoom = lerp(
					ucusZoom,
					Math.min(ucusZoom + 1, 20),
					zoomT
				);

				aktifDurakIndex = bacakIndex + 1;

				map.jumpTo({
					center: [currentLng, currentLat],
					zoom: currentZoom,
					pitch: dronePitch,
					bearing: currentBearing
				});

				if (gecenSure < toplamUcusSuresi) {
					ucusAnimasyonFrame = requestAnimationFrame(frame);
				} else {
					const sonDurak = rota[rota.length - 1];

					map.jumpTo({
						center: sonDurak.koordinat,
						zoom: currentZoom,
						pitch: dronePitch,
						bearing: bacak.bearingHedef
					});

					ucusBaslatildi = false;
					ucusMuziginiDurdur();
					cancelAnimationFrame(kronometreFrame);
					ucusAnimasyonFrame = null;
					ucusKaydiniDurdur();
					
					setTimeout(function () {
						document.getElementById('ucus-modal').style.display = 'flex';
					}, 10000);
				}
			}

			ucusAnimasyonFrame = requestAnimationFrame(frame);
		});
	}, 5000);
}


function playSmoothColoredListFlow(texts, onComplete) {

    // Önceki kart varsa kaldır

                color: #fff;
                padding: 5px 12px;
                border-radius: 6px;
                letter-spacing: 1px;
            }

            @media (max-width: 480px) {
                #smooth-info-card {
                    top: 16px;
                    left: 16px;
                    min-width: 0;
                    max-width: calc(100% - 32px);
                    padding: 16px 18px;
                }
            }
        `;
        document.head.appendChild(style);
    }

    const container = document.createElement('div');
    container.id = 'smooth-info-card';
    mapContainer.appendChild(container);

    requestAnimationFrame(() => container.classList.add('card-show'));

    let index = 0;

    function processNextLine() {
        if (!ucusBaslatildi) {
            container.remove();
            return;
        }

        if (index >= texts.length) {
            setTimeout(() => {
                container.classList.remove('card-show');
                container.classList.add('card-hide');

                setTimeout(() => {
                    container.remove();
                    if (typeof onComplete === 'function') onComplete();
                }, 800);
            }, 1500);
            return;
        }

        const item = texts[index];
        const line = document.createElement('div');
        line.className = 'smooth-line';
        line.style.color = item.color || '#ffffff';
        line.style.fontSize = `${parseFloat(item.size) || 16}px`;
        line.style.fontWeight = item.weight || '500';

        if (item.isBadge) {
            const badge = document.createElement('span');
            badge.className = 'line-badge';
            badge.style.background = item.color || '#0284c7';
            badge.textContent = item.text || '';
            line.appendChild(badge);
        } else {
            line.textContent = item.text || '';
        }

        container.appendChild(line);

        requestAnimationFrame(() => line.classList.add('line-show'));

        index++;
        setTimeout(processNextLine, 2000);
    }

    processNextLine();
}

async function gercekMp4Olustur(webmBlob) {
    console.log('[MP4] Dönüştürme fonksiyonu başladı.');

    if (!mp4Donusturucu) {
        console.log('[MP4] FFmpeg yükleniyor...');

        const { FFmpeg } = await import(
            './ffmpeg/ffmpeg/index.js'
        );

        mp4Donusturucu = new FFmpeg();

        mp4Donusturucu.on('log', ({ message }) => {
            console.log('[FFmpeg]', message);
        });

        mp4Donusturucu.on('progress', ({ progress }) => {
            console.log(
                '[MP4] İlerleme:',
                Math.round(progress * 100) + '%'
            );
        });

                try {
				const kok = location.origin;

				console.log('[MP4] Core dosyası yükleniyor...');

				await mp4Donusturucu.load({
					coreURL: kok + '/ffmpeg/core/ffmpeg-core.js?v=esm1',
					wasmURL: kok + '/ffmpeg/core/ffmpeg-core.wasm',
					classWorkerURL: kok + '/ffmpeg/ffmpeg/worker.js'
				});

				console.log('[MP4] FFmpeg hazır.');

			} catch (e) {
				console.error('[MP4] FFmpeg yükleme hatası:', e);
				mp4Donusturucu = null;
				throw e;
			}
    }

    console.log('[MP4] WebM dosyası hazırlanıyor...');

    await mp4Donusturucu.writeFile(
        'ucus.webm',
        new Uint8Array(await webmBlob.arrayBuffer())
    );

    console.log('[MP4] H.264 MP4 dönüşümü başladı...');

    await mp4Donusturucu.exec([
        '-i', 'ucus.webm',
        '-map', '0:v:0',
        '-an',
        '-c:v', 'libx264',
        '-preset', 'ultrafast',
        '-crf', '23',
        '-vf', 'scale=trunc(iw/2)*2:trunc(ih/2)*2',
        '-pix_fmt', 'yuv420p',
        '-profile:v', 'baseline',
        '-level', '3.1',
        '-tag:v', 'avc1',
        '-movflags', '+faststart',
        '-f', 'mp4',
        'ucus.mp4'
    ]);

    console.log('[MP4] Sonuç okunuyor...');

    const sonuc = await mp4Donusturucu.readFile('ucus.mp4');

    if (!sonuc || sonuc.length === 0) {
        throw new Error('Dönüştürülen MP4 dosyası boş.');
    }

    console.log(
        '[MP4] Dönüşüm tamamlandı:',
        Math.round(sonuc.length / 1024),
        'KB'
    );

    return new Blob([sonuc], {
        type: 'video/mp4'
    });
}

window.ucusKayitRecorder = window.ucusKayitRecorder || null;
window.ucusKayitAkis = window.ucusKayitAkis || null;
window.ucusKayitParcalari = window.ucusKayitParcalari || [];
window.ucusKayitBaslatiliyor = window.ucusKayitBaslatiliyor || false;

async function ucusKaydiniHazirla() {
    if (!navigator.mediaDevices?.getDisplayMedia) {
        bildirimGoster('Tarayıcınız ekran kaydını desteklemiyor.', 'uyari');
        return;
    }

    window.ucusKayitBaslatiliyor = true;

    try {
        window.ucusKayitAkis = await navigator.mediaDevices.getDisplayMedia({
            video: {
                displaySurface: "browser",
                frameRate: { ideal: 30, max: 30 }
            },
            audio: false,
            preferCurrentTab: true
        });

        window.ucusKayitParcalari = [];

        let secilenTur = 'video/webm';
        const olasiTurler = [
			'video/webm;codecs=vp9',
			'video/webm;codecs=vp8',
			'video/webm'
		];
        for (let tur of olasiTurler) {
            if (MediaRecorder.isTypeSupported(tur)) {
                secilenTur = tur;
                break;
            }
        }

        window.ucusKayitRecorder = new MediaRecorder(window.ucusKayitAkis, {
            mimeType: secilenTur,
            videoBitsPerSecond: 12000000
        });

        window.ucusKayitRecorder.ondataavailable = olay => {
            if (olay.data && olay.data.size > 0) {
                window.ucusKayitParcalari.push(olay.data);
            }
        };

        
		window.ucusKayitRecorder.onstop = async () => {
			window.ucusKayitBaslatiliyor = false;

			const kayit = window.ucusKayitRecorder;
			const kayitTuru = kayit?.mimeType || secilenTur;

			const hamBlob = new Blob(window.ucusKayitParcalari, {
				type: kayitTuru
			});

			try {
				if (!hamBlob.size) {
					throw new Error('Kayıt verisi boş.');
				}

				let sonucBlob;

				if (kayitTuru.includes('mp4')) {
					sonucBlob = hamBlob;
				} else {
					console.log('WebM kaydı gerçek MP4 formatına dönüştürülüyor...');
					sonucBlob = await gercekMp4Olustur(hamBlob);
				}

				if (!sonucBlob.size) {
					throw new Error('MP4 dosyası boş oluştu.');
				}

				const url = URL.createObjectURL(sonucBlob);
				const link = document.createElement('a');

				link.href = url;
				link.download = 'ennetmax_ucus_kaydi.mp4';

				document.body.appendChild(link);
				link.click();
				link.remove();

				setTimeout(() => URL.revokeObjectURL(url), 60000);

				console.log(
					'MP4 indirildi:',
					Math.round(sonucBlob.size / 1024),
					'KB'
				);

			} catch (err) {
				console.error('MP4 dönüşümünün gerçek hatası:', err);

				const webmBlob = new Blob(window.ucusKayitParcalari, {
					type: kayitTuru
				});

				if (webmBlob.size > 0) {
					const url = URL.createObjectURL(webmBlob);
					const link = document.createElement('a');

					link.href = url;
					link.download = 'ennetmax_ucus_kaydi.webm';

					document.body.appendChild(link);
					link.click();
					link.remove();

					setTimeout(() => URL.revokeObjectURL(url), 60000);
				}

				bildirimGoster('MP4 dönüşümü başarısız. F12 > Console bölümündeki kırmızı hataya bak.', 'olumsuz');
			} finally {
				window.ucusKayitAkis?.getTracks().forEach(track => track.stop());

				window.ucusKayitRecorder = null;
				window.ucusKayitAkis = null;
				window.ucusKayitParcalari = [];
				window.ucusKayitBaslatiliyor = false;
			}
		};


        window.ucusKayitAkis.getVideoTracks()[0].addEventListener('ended', () => {
            if (window.ucusKayitRecorder?.state === 'recording') {
                window.ucusKayitRecorder.stop();
            }
        });

        window.ucusKayitRecorder.start(1000);

    } catch (err) {
        window.ucusKayitBaslatiliyor = false;
        console.error("Kayıt başlatılamadı:", err);
    }
}

function ucusKaydiniDurdur() {
    window.ucusKayitBaslatiliyor = false;
    if (window.ucusKayitRecorder && window.ucusKayitRecorder.state === 'recording') {
        window.ucusKayitRecorder.stop();
    }
}

// =====================================================
// YOL ETİKETİ VERİ DOĞRULAMA
// =====================================================

function yolYazisiVerisiniDogrula(y) {
    if (!y || typeof y !== 'object') return false;

    if (typeof y.yolAdi !== 'string' || !y.yolAdi.trim()) {
        return false;
    }

    const boyut = Number(y.boyut);

    if (!Number.isFinite(boyut) || boyut < 6 || boyut > 50) {
        return false;
    }

    function noktaGecerli(nokta) {
        return Array.isArray(nokta) &&
            nokta.length >= 2 &&
            Number.isFinite(Number(nokta[0])) &&
            Number.isFinite(Number(nokta[1])) &&
            Number(nokta[0]) >= -180 &&
            Number(nokta[0]) <= 180 &&
            Number(nokta[1]) >= -90 &&
            Number(nokta[1]) <= 90;
    }

    return noktaGecerli(y.nokta1) && noktaGecerli(y.nokta2);
}


// =====================================================
// YOL ETİKETİ KAYITLARINI HAZIRLA
// =====================================================

function yolYazisiKayitlariniHazirla() {
    return window.yolYazilari.map(y => ({
        id: y.id,
        yolAdi: y.yolAdi,
        boyut: y.boyut,
        nokta1: [...y.nokta1],
        nokta2: [...y.nokta2]
    }));
}


// =====================================================
// YOL ETİKETİ GEOJSON HAZIRLA
// =====================================================

function yolYazisiGeoJSONHazirla(kayitlar = window.yolYazilari) {
    return {
        type: 'FeatureCollection',
        features: kayitlar.map(y => ({
            type: 'Feature',
            properties: {
                kayit_id: y.id,
                yol_adi: y.yolAdi,
                yol_boyutu: Number(y.boyut)
            },
            geometry: {
                type: 'LineString',
                coordinates: [
                    y.nokta1,
                    y.nokta2
                ]
            }
        }))
    };
}


// =====================================================
// YOL ETİKETLERİ KATMANINI HAZIRLA
// =====================================================

function yolYazisiTopluKatmaniniHazirla() {
    if (!map || !map.isStyleLoaded()) return;

    if (!map.getSource('yol-yazilari-toplu-source')) {
        map.addSource('yol-yazilari-toplu-source', {
            type: 'geojson',
            data: yolYazisiGeoJSONHazirla()
        });
    }

    if (!map.getLayer('yol-yazilari-toplu-text')) {
        map.addLayer({
            id: 'yol-yazilari-toplu-text',
            type: 'symbol',
            source: 'yol-yazilari-toplu-source',

            layout: {
                'symbol-placement': 'line-center',

                'text-field': ['get', 'yol_adi'],

                'text-size': [
                    'get',
                    'yol_boyutu'
                ],

                'text-font': [
                    'Open Sans Bold',
                    'Arial Unicode MS Bold'
                ],

                'text-letter-spacing': 0.15,

                'text-pitch-alignment': 'viewport',
                'text-rotation-alignment': 'map',
                'text-keep-upright': true,

                'text-allow-overlap': true,
                'text-ignore-placement': true
            },

            paint: {
                'text-color': '#ffffff',
                'text-halo-color': '#0f172a',
                'text-halo-width': 2.5
            },

            minzoom: 0,
            maxzoom: 24
        });
    }

    yolYazisiHaritaVerisiniGuncelle();
}


// =====================================================
// YOL ETİKETİ HARİTA VERİSİNİ GÜNCELLE
// =====================================================

function yolYazisiHaritaVerisiniGuncelle() {
    if (!map || !map.isStyleLoaded()) return;

    const source = map.getSource('yol-yazilari-toplu-source');

    if (source) {
        source.setData(yolYazisiGeoJSONHazirla());
    }
}

// =====================================================
// YOL ETİKETİ EKLE / GÜNCELLE
// =====================================================

function yolYazisiniKatmanaDonustur(
    yolAdi,
    boyut,
    nokta1,
    nokta2,
    id = null
) {
    const yeniKayit = {
        id: id || `yol-yazisi-${++yolYazisiSayaci}`,
        yolAdi: String(yolAdi).trim(),
        boyut: Number(boyut),
        nokta1: [...nokta1],
        nokta2: [...nokta2]
    };

    if (!yolYazisiVerisiniDogrula(yeniKayit)) {
        return false;
    }

    const mevcutIndex = window.yolYazilari.findIndex(
        y => y.id === yeniKayit.id
    );

    if (mevcutIndex >= 0) {
        window.yolYazilari[mevcutIndex] = yeniKayit;
    } else {
        window.yolYazilari.push(yeniKayit);
    }

    yolYazisiHaritaVerisiniGuncelle();
    yolYazilariniKaydet();

    return true;
}

// YOL ETİKETLERİNİ YÜKLE
// =====================================================

async function yolYazilariniYukle(kayitlar, { temizle = false } = {}) {
    if (!Array.isArray(kayitlar)) return;

    if (temizle) {
        window.yolYazilari = [];
        yolYazisiSayaci = 0;
    }

    for (const y of kayitlar) {
        if (!yolYazisiVerisiniDogrula(y)) continue;

        const id = y.id || `yol-yazisi-${++yolYazisiSayaci}`;

        const yeniKayit = {
            id,
            yolAdi: y.yolAdi.trim(),
            boyut: Number(y.boyut),
            nokta1: [...y.nokta1].map(Number),
            nokta2: [...y.nokta2].map(Number)
        };

        const mevcutIndex = window.yolYazilari.findIndex(
            kayit => kayit.id === id
        );

        if (mevcutIndex >= 0) {
            window.yolYazilari[mevcutIndex] = yeniKayit;
        } else {
            window.yolYazilari.push(yeniKayit);
        }
    }

    yolYazisiSayaci = Math.max(
        yolYazisiSayaci,
        window.yolYazilari.length
    );

    if (map.isStyleLoaded()) {
        yolYazisiTopluKatmaniniHazirla();
    } else {
        map.once('load', yolYazisiTopluKatmaniniHazirla);
    }

    yolYazilariniKaydet();
}

// =====================================================
// HARİTA TIKLAMASI
// YOL ETİKETİ ÖNCELİKLİ, DURAK SEÇİMİ SONRA
// =====================================================

map.on('click', function (e) {

    // -------------------------------------------------
    // 1. YOL YAZISI SİLME MODU
    // -------------------------------------------------

    if (yolYazisiSilmeAktif) {
        const bulunanlar = map.queryRenderedFeatures(e.point, {
            layers: ['yol-yazilari-toplu-text']
        });

        if (!bulunanlar.length) {
            bildirimGoster(
                'Bu noktada silinecek yol yazısı bulunamadı.',
                'uyari'
            );
            return;
        }

        const kayitId = bulunanlar[0].properties.kayit_id;

        const index = window.yolYazilari.findIndex(
            y => String(y.id) === String(kayitId)
        );

        if (index === -1) {
            bildirimGoster('Yol yazısı kaydı bulunamadı.', 'olumsuz');
            return;
        }

        const silinenAd = window.yolYazilari[index].yolAdi;

        window.yolYazilari.splice(index, 1);

        yolYazisiHaritaVerisiniGuncelle();
        yolYazilariniKaydet();
        yolYazisiSeciminiIptalEt();

        bildirimGoster(
            '"' + silinenAd + '" yol yazısı silindi.',
            'olumlu'
        );

        return;
    }


    // -------------------------------------------------
    // 2. YOL YAZISI NOKTA SEÇİMİ
    // -------------------------------------------------

    if (yolYazisiSecimAktif) {
        const nokta = [
            e.lngLat.lng,
            e.lngLat.lat
        ];

        if (!yolYazisiIlkNokta) {
            yolYazisiIlkNokta = nokta;

            bildirimGoster(
                'Şimdi yolun bitiş noktasını seçin.'
            );

            return;
        }

        const basarili = yolYazisiniKatmanaDonustur(
            secilenYolAdi,
            secilenYolBoyutu,
            yolYazisiIlkNokta,
            nokta
        );

        if (basarili) {
            bildirimGoster(
                'Yol yazısı haritaya eklendi.',
                'olumlu'
            );

            yolYazisiSeciminiIptalEt();

            yolYazisiMetni.value = '';
            yolYazisiSize.value = 13;

        } else {
            bildirimGoster(
                'Yol yazısı oluşturulamadı.',
                'olumsuz'
            );
        }

        return;
    }


    // -------------------------------------------------
    // 3. MEVCUT DURAK KOORDİNAT SEÇİMİ
    // -------------------------------------------------

    if (!koordinatSecilecekInput) return;

    koordinatSecilecekInput.value =
        `${e.lngLat.lng.toFixed(6)}, ${e.lngLat.lat.toFixed(6)}`;

    koordinatSecilecekInput.dispatchEvent(
        new Event('input', { bubbles: true })
    );

    koordinatSecilecekInput.dispatchEvent(
        new Event('change', { bubbles: true })
    );

    if (!window.ucusSecilenNoktaIsaretcileri) {
        window.ucusSecilenNoktaIsaretcileri = [];
    }

    const yeniIsaretci = new mapboxgl.Marker()
        .setLngLat(e.lngLat)
        .addTo(map);

    window.ucusSecilenNoktaIsaretcileri.push(yeniIsaretci);

    koordinatSecilecekInput = null;

    document.querySelectorAll('.haritadan-koordinat-sec')
        .forEach(b => b.classList.remove('aktif'));

    map.getCanvas().style.cursor = '';
});


// =====================================================
// ESC TUŞU
// =====================================================

document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;

    if (yolYazisiSecimAktif || yolYazisiSilmeAktif) {
        yolYazisiSeciminiIptalEt();

        bildirimGoster(
            'Yol yazısı işlemi iptal edildi.'
        );

        e.preventDefault();
        return;
    }

    if (!koordinatSecilecekInput) return;

    koordinatSecilecekInput = null;

    document.querySelectorAll('.haritadan-koordinat-sec')
        .forEach(b => b.classList.remove('aktif'));

    map.getCanvas().style.cursor = '';

    e.preventDefault();
});

function create3DMarkerWithPulse(coordinates, titleText) {
    const el = document.createElement('div');
    el.className = 'sky-universal-label';

    const text = document.createElement('span');
    text.className = 'label-main';

    String(titleText ?? '')
        .split(/\\n|\n|\r\n/)
        .slice(0, 2)
        .map(s => s.trim())
        .filter(Boolean)
        .forEach((line, i) => {
            if (i > 0) text.appendChild(document.createElement('br'));
            text.appendChild(document.createTextNode(line));
        });

    const container = document.createElement('div');
    container.className = 'marker-container';

    const textContainer = document.createElement('div');
    textContainer.className = 'text-container';
    textContainer.appendChild(text);

    const pulseWrapper = document.createElement('div');
    pulseWrapper.className = 'pulse-wrapper';
    pulseWrapper.innerHTML = `
        <div class="pulse-ring"></div>
        <div class="pulse-core"></div>
    `;

    container.appendChild(textContainer);
    container.appendChild(pulseWrapper);
    el.appendChild(container);

    if (!document.getElementById('universal-marker-style')) {
        const style = document.createElement('style');
        style.id = 'universal-marker-style';
        style.textContent = `
            .sky-universal-label {
                pointer-events:none;
                user-select:none;
            }
            .marker-container {
                display:flex;
                flex-direction:column;
                align-items:center;
                position:relative;
            }
            .text-container {
                display:flex;
                align-items:center;
                justify-content:center;
                animation:universalFloat 3s ease-in-out infinite;
                margin-bottom:12px;
            }
            .label-main {
                font-family: Arial, sans-serif;
                font-size: 26px;
                font-weight: 700;
                color: #ffffff;
                letter-spacing: 1px;
                text-transform: uppercase;
                display: inline-block;
                text-align: center;
                line-height: 1.35;
                -webkit-text-stroke: 0;
                text-shadow:
                    0 0 2px rgba(255, 255, 255, 0.45),
                    0 2px 4px rgba(0, 0, 0, 0.95),
                    0 5px 12px rgba(0, 0, 0, 0.7);
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }
            .pulse-wrapper {
                position:relative;
                width:36px;
                height:36px;
                display:flex;
                align-items:center;
                justify-content:center;
            }
            .pulse-core {
                width:12px;
                height:12px;
                background:#38bdf8;
                border-radius:50%;
                box-shadow:0 0 12px #38bdf8, inset 0 0 4px rgba(255,255,255,.8);
                z-index:2;
            }
            .pulse-ring {
                position:absolute;
                inset:0;
                margin:auto;
                width:36px;
                height:36px;
                border:2px solid #38bdf8;
                border-radius:50%;
                animation:universalPulseWave 2s infinite ease-out;
                opacity:.8;
                z-index:1;
            }
            @keyframes universalPulseWave {
                0% { transform:scale(.5); opacity:1; }
                100% { transform:scale(2.4); opacity:0; }
            }
            @keyframes universalFloat {
                0%,100% { transform:translateY(0); }
                50% { transform:translateY(-6px); }
            }
        `;
        document.head.appendChild(style);
    }

    const marker = new mapboxgl.Marker({
        element: el,
        anchor: 'bottom',
        pitchAlignment: 'viewport',
        rotationAlignment: 'viewport'
    })
    .setLngLat(coordinates)
    .addTo(map);

    return marker;
}


function ucusEtiketleriniHaritayaEkle(rota) {
    if (window.ucusEtiketMarkerlari) {
        window.ucusEtiketMarkerlari.forEach(marker => marker.remove());
    }

    window.ucusEtiketMarkerlari = [];

    rota.forEach(durak => {
        const etiket = String(durak.etiket || '').trim();

        if (!etiket) return;

        const marker = create3DMarkerWithPulse(
            durak.koordinat,
            etiket
        );

        if (marker) {
            window.ucusEtiketMarkerlari.push(marker);
        }
    });
}

        const dosya = geojsonDosyalari[Number(secilenIndex)];
        if (!dosya) return;

        ekleBtn.disabled = true;
        mesaj.textContent = dosya.name + ' indiriliyor...';

        try {
            const dosyaCevap = await fetch(dosya.download_url);

            if (!dosyaCevap.ok) {
                throw new Error('GeoJSON dosyası indirilemedi.');
            }

            const geojson = await dosyaCevap.json();

            let veri = geojson;

            if (geojson.type === 'Polygon' || geojson.type === 'MultiPolygon') {
                veri = {
                    type: 'FeatureCollection',
                    features: [{
                        type: 'Feature',
                        properties: {},
                        geometry: geojson
                    }]
                };

            } else if (geojson.type === 'GeometryCollection') {
                veri = {
                    type: 'FeatureCollection',
                    features: geojson.geometries.map(geometri => ({
                        type: 'Feature',
                        properties: {},
                        geometry: geometri
                    }))
                };

            } else if (geojson.type === 'Feature') {
                veri = {
                    type: 'FeatureCollection',
                    features: [geojson]
                };
            }

            if (!Array.isArray(veri.features) || veri.features.length === 0) {
                throw new Error('GeoJSON içinde gösterilecek geometri bulunamadı.');
            }


            // -------------------------------------------------
            // GEOJSON İÇİNDEKİ ENNETMAX YOL ETİKETLERİNİ AL
            // -------------------------------------------------

            const geojsonYolYazilari = [];

            veri.features.forEach((feature, index) => {
                const props = feature.properties || {};
                const geometri = feature.geometry;

                if (!geometri || geometri.type !== 'LineString') return;

                const yolAdi = props.yol_adi || props.yolAdi;

                const ennetmaxYolYazisi =
                    props.ennetmax_turu === 'yol-yazisi' ||
                    Boolean(yolAdi);

                if (!ennetmaxYolYazisi || !yolAdi) return;

                const koordinatlar = geometri.coordinates;

                if (!Array.isArray(koordinatlar) || koordinatlar.length < 2) {
                    return;
                }

                const ilkNokta = koordinatlar[0];
                const sonNokta = koordinatlar[koordinatlar.length - 1];

                const boyut = Number(
                    props.yol_boyutu ||
                    props.boyut ||
                    13
                );

                const kayit = {
                    id: props.kayit_id || `geojson-yol-${Date.now()}-${index}`,
                    yolAdi: String(yolAdi),
                    boyut,
                    nokta1: ilkNokta,
                    nokta2: sonNokta
                };

                if (yolYazisiVerisiniDogrula(kayit)) {
                    geojsonYolYazilari.push(kayit);
                }
            });

            if (geojsonYolYazilari.length) {
                await yolYazilariniYukle(geojsonYolYazilari);
            }


            // -------------------------------------------------
            // MEVCUT PARSEL GEOJSON İŞLEMLERİ
            // -------------------------------------------------

            const kaynakId = 'hedef-parsel-geojson';
            const dolguId = 'hedef-parsel-dolgu';
            const haloId = 'hedef-parsel-halo';
            const sinirId = 'hedef-parsel-sinir';

            if (window.parselHaloAnimasyonu) {
                cancelAnimationFrame(window.parselHaloAnimasyonu);
                window.parselHaloAnimasyonu = null;
            }

            [sinirId, haloId, dolguId].forEach(id => {
                if (map.getLayer(id)) map.removeLayer(id);
            });

            if (map.getSource(kaynakId)) {
                map.removeSource(kaynakId);
            }

            map.addSource(kaynakId, {
                type: 'geojson',
                data: veri
            });

            map.addLayer({
                id: dolguId,
                type: 'fill',
                source: kaynakId,
                filter: [
                    'any',
                    ['==', ['geometry-type'], 'Polygon'],
                    ['==', ['geometry-type'], 'MultiPolygon']
                ],
                paint: {
                    'fill-color': '#0284c7',
                    'fill-opacity': 0.25
                }
            });

            map.addLayer({
                id: haloId,
                type: 'line',
                source: kaynakId,
                filter: [
                    'any',
                    ['==', ['geometry-type'], 'Polygon'],
                    ['==', ['geometry-type'], 'MultiPolygon']
                ],
                layout: {
                    'line-join': 'round',
                    'line-cap': 'round'
                },
                paint: {
                    'line-color': '#0891b2',
                    'line-width': 10,
                    'line-opacity': 0.95
                }
            });

            map.addLayer({
                id: sinirId,
                type: 'line',
                source: kaynakId,
                filter: [
                    'any',
                    ['==', ['geometry-type'], 'Polygon'],
                    ['==', ['geometry-type'], 'MultiPolygon']
                ],
                layout: {
                    'line-join': 'round',
                    'line-cap': 'round'
                },
                paint: {
                    'line-color': '#ffffff',
                    'line-width': 4,
                    'line-opacity': 1
                }
            });

            const koordinatlar = [];

            function koordinatlariTara(deger) {
                if (!Array.isArray(deger)) return;

                if (
                    deger.length >= 2 &&
                    typeof deger[0] === 'number' &&
                    typeof deger[1] === 'number'
                ) {
                    koordinatlar.push(deger);
                    return;
                }

                deger.forEach(koordinatlariTara);
            }

            function geometriKoordinatlariniTara(geometri) {
                if (!geometri) return;

                if (geometri.type === 'GeometryCollection') {
                    geometri.geometries.forEach(geometriKoordinatlariniTara);
                } else {
                    koordinatlariTara(geometri.coordinates);
                }
            }

            veri.features.forEach(feature => {
                geometriKoordinatlariniTara(feature.geometry);
            });

            if (koordinatlar.length === 0) {
                throw new Error('GeoJSON koordinatları bulunamadı.');
            }

            const sinirlar = new mapboxgl.LngLatBounds();

            koordinatlar.forEach(koordinat => {
                sinirlar.extend([koordinat[0], koordinat[1]]);
            });

            map.fitBounds(sinirlar, {
                padding: 70,
                maxZoom: 19,
                duration: 1800
            });

            let baslangicZamani = null;

            function haloAnimasyonunuCalistir(zaman) {
                if (!map.getLayer(haloId)) {
                    window.parselHaloAnimasyonu = null;
                    return;
                }

                if (baslangicZamani === null) {
                    baslangicZamani = zaman;
                }

                const oran = ((zaman - baslangicZamani) % 1600) / 1600;
                const parlaklik = (1 - Math.cos(oran * Math.PI * 2)) / 2;

                map.setPaintProperty(haloId, 'line-width', 7 + parlaklik * 7);
                map.setPaintProperty(haloId, 'line-opacity', 0.4 + parlaklik * 0.55);

                window.parselHaloAnimasyonu =
                    requestAnimationFrame(haloAnimasyonunuCalistir);
            }

            window.parselHaloAnimasyonu =
                requestAnimationFrame(haloAnimasyonunuCalistir);

            console.log('Yüklenen GeoJSON:', veri);

            bildirimGoster(
                'GeoJSON haritaya eklendi: ' + dosya.name,
                'olumlu'
            );

            secimKutusu.style.display = 'none';

        } catch (hata) {
            console.error('GeoJSON yükleme hatası:', hata);
            mesaj.textContent = 'Dosya yüklenemedi: ' + hata.message;
            bildirimGoster(
                'GeoJSON yüklenemedi: ' + hata.message,
                'olumsuz'
            );

        } finally {
            ekleBtn.disabled = false;
        }
    };
});

(function () {
    const modalKart = document.querySelector(
        '#ucus-modal .ucus-modal-kart'
    );

    const baslik = modalKart?.querySelector('h2');

    if (!modalKart || !baslik) return;

    let surukleniyor = false;
    let baslangicX = 0;
    let baslangicY = 0;
    let kartX = 0;
    let kartY = 0;

    baslik.addEventListener('mousedown', function (e) {
        if (e.button !== 0) return;

        const rect = modalKart.getBoundingClientRect();

        surukleniyor = true;
        baslangicX = e.clientX;
        baslangicY = e.clientY;
        kartX = rect.left;
        kartY = rect.top;

        modalKart.style.position = 'fixed';
        modalKart.style.left = kartX + 'px';
        modalKart.style.top = kartY + 'px';
        modalKart.style.margin = '0';

        e.preventDefault();
    });

    document.addEventListener('mousemove', function (e) {
        if (!surukleniyor) return;

        const yeniX = kartX + e.clientX - baslangicX;
        const yeniY = kartY + e.clientY - baslangicY;

        modalKart.style.left = Math.max(
            0,
            Math.min(yeniX, window.innerWidth - modalKart.offsetWidth)
        ) + 'px';

        modalKart.style.top = Math.max(
            0,
            Math.min(yeniY, window.innerHeight - modalKart.offsetHeight)
        ) + 'px';
    });

    document.addEventListener('mouseup', function () {
        surukleniyor = false;
    });
})();

                <option value="32">32 px</option>
            </select>

                <option value="800">Çok kalın</option>

            <label>
                <input type="checkbox" class="bilgi-rozet">
                Rozet olarak göster
            </label>
        `;

        satir.querySelector('.bilgi-metni').value = bilgi.text ?? '';
        satir.querySelector('.bilgi-rengi').value = bilgi.color ?? '#ffffff';
        satir.querySelector('.bilgi-boyutu').value = String(bilgi.size ?? '16');
        satir.querySelector('.bilgi-kalinligi').value = String(bilgi.weight ?? '500');
        satir.querySelector('.bilgi-rozet').checked = Boolean(bilgi.isBadge);

        satir.querySelector('.bilgi-sil').addEventListener('click', () => {
            satir.remove();
        });

        satir.addEventListener('dragstart', function (e) {
            satir.style.opacity = '0.5';

            e.dataTransfer.setData(
                'text/plain',
                Array.from(bilgiSatirlari.children).indexOf(satir)
            );

            e.dataTransfer.effectAllowed = 'move';
        });

        satir.addEventListener('dragend', function () {
            satir.style.opacity = '1';
        });

        satir.addEventListener('dragover', function (e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
        });

        satir.addEventListener('drop', function (e) {
            e.preventDefault();

            const kaynakIndex = Number(e.dataTransfer.getData('text/plain'));
            const satirlar = Array.from(bilgiSatirlari.children);
            const kaynakSatir = satirlar[kaynakIndex];

            if (!kaynakSatir || kaynakSatir === satir) return;

            const hedefRect = satir.getBoundingClientRect();
            const altaBirak = e.clientY > hedefRect.top + hedefRect.height / 2;

            if (altaBirak) {
                satir.after(kaynakSatir);
            } else {
                satir.before(kaynakSatir);
            }
        });

        bilgiSatirlari.appendChild(satir);
    });
}

function bildirimGoster(mesaj, tur = 'bilgi', sure = 3000) {
    let alan = document.getElementById('ust-bildirim-alani');

    if (!alan) {
        alan = document.createElement('div');
        alan.id = 'ust-bildirim-alani';
        document.body.appendChild(alan);
    }

    const simgeler = {
        olumlu: '✓',
        bilgi: '−',
        uyari: '!',
        olumsuz: '×'
    };

    const bildirim = document.createElement('div');
    bildirim.className = `ust-bildirim ${tur}`;

    const simge = document.createElement('span');
    simge.className = 'bildirim-simge';
    simge.textContent = simgeler[tur] || simgeler.bilgi;

    const yazi = document.createElement('span');
    yazi.textContent = mesaj;

    bildirim.append(simge, yazi);
    alan.appendChild(bildirim);

    requestAnimationFrame(() => bildirim.classList.add('goster'));

    setTimeout(() => {
        bildirim.classList.remove('goster');
        setTimeout(() => bildirim.remove(), 300);
    }, sure);
}
